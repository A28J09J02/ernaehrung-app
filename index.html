<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{transition:opacity .12s,transform .12s}button:active{opacity:.6}.btn:active,.mpl:active,.mpb:active,.plus:active,.qb:active,.res:active,.gx:active{transform:scale(.97)}

.meal{padding-bottom:0}

.mh{font-size:20px;margin:16px 2px 8px}.mgo{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);max-width:640px;margin:auto}
.mft{display:flex;border-top:1px solid var(--grid);margin:4px -14px 0}.mft button{flex:1;border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;padding:11px 6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.mft button+button{border-left:1px solid var(--grid)}.mft svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cpy{display:block;width:100%;text-align:left;border:1px dashed color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 6%,var(--card));color:var(--acc);border-radius:12px;padding:9px 12px;margin:2px 0 10px;font-size:14px;font-weight:600}

.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}

 border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

.top .dtl{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:2px 0}

/* Seitenmenü */

.drawer{position:fixed;top:0;bottom:0;left:0;z-index:16;width:min(82vw,320px);background:var(--card);transform:translateX(-102%);transition:transform .25s ease;
 padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;box-shadow:0 0 40px rgba(0,0,0,.2);overflow-y:auto}

.drawer.dragg{transition:none}

video{width:100%;border-radius:var(--rad);background:#000;aspect-ratio:3/4;object-fit:cover}

.lblbtn{display:block;text-align:center;margin:6px 0 2px;cursor:pointer}.lblst{margin:4px 0 0;min-height:0;color:var(--mute)}.lblst.ok{color:var(--g)}.lblst.warn{color:var(--y)}.lblst.bad{color:var(--r)}
.inp.auto{background:var(--acc-bg)}

 opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;display:flex;justify-content:space-between;align-items:center;gap:10px}

.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.tg input{width:22px;height:22px;accent-color:var(--acc)}
.cmp{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
.foot{font-size:12px;color:var(--mute);margin:16px 2px}
/* Mein Tag */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.tile span{font-size:12px;color:var(--mute);display:block}
.tile b{font-size:24px;font-weight:700;display:block;line-height:1.2}.tile b small{font-size:13px;font-weight:500;color:var(--mute)}.tile em{font-style:normal;font-size:12px}
.wkp{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}.wkp div{background:var(--grid);border-radius:10px;padding:6px 0}.wkp div.t{outline:2px solid var(--acc)}
.wkp b{display:block;font-size:18px;line-height:1.3}
.burn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--grid);text-align:center}
.burn b{display:block;font-size:20px;font-weight:700;line-height:1.2}.burn span{font-size:12px;color:var(--mute)}.burn .fire b{color:#d4661a}
@media(prefers-color-scheme:dark){.burn .fire b{color:#f3a14f}}
.wt{display:flex;justify-content:space-between;align-items:center;gap:10px}.wt b{font-size:22px}.wt div{text-align:center;flex:1}.wt span{display:block;font-size:12px;color:var(--mute)}
.alist{display:flex;flex-wrap:wrap;gap:8px}.alist div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.alist div b{color:var(--ink);font-weight:600}.alist i{font-style:normal;font-size:18px}
.fr{font-size:12px;color:var(--mute);text-align:center;margin:-4px 0 10px}
/* Tagebuch: Klassen statt Inline-Stilen, „+“-Knopf im Daumenbereich */
.plus{border:0;background:var(--acc);color:#fff;width:36px;height:36px;margin:4px;border-radius:50%;font-size:24px;line-height:1;font-weight:500;display:inline-flex;align-items:center;justify-content:center;padding:0 0 2px}
.hint.acc{background:color-mix(in srgb,var(--acc) 10%,var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.card.acc{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.ringnote{margin:6px 0 0;text-align:center}.centernote{margin:8px 0 0;text-align:center}.block{display:block}
.row.mb{margin:0 0 12px}.mt10{margin-top:10px}.p6{margin:0 0 6px}
.btn.sm{padding:4px 10px;font-size:13px}.west{margin-top:10px;display:grid;gap:4px}
.burn .na b{color:var(--mute)}
main.slide-l{animation:sl .22s ease}main.slide-r{animation:sr .22s ease}
main.dragx{will-change:transform}main.snap{transition:transform .28s cubic-bezier(.2,.9,.3,1.15)}
#dhint{position:fixed;top:50%;z-index:40;padding:8px 13px;border-radius:999px;background:var(--card);color:var(--mute);font-size:14px;font-weight:600;
 box-shadow:0 4px 16px rgba(0,0,0,.14);pointer-events:none;opacity:0;transform:translateY(-50%) scale(.85);transition:opacity .15s,transform .15s,background .15s,color .15s}
#dhint.l{left:10px}#dhint.r{right:10px}#dhint.on{opacity:1;transform:translateY(-50%) scale(1)}#dhint.go{background:var(--acc);color:#fff;transform:translateY(-50%) scale(1.06)}
@keyframes sl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}@keyframes sr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
/* Suchergebnisse */
.res{border-left:4px solid var(--src,var(--line));padding:11px 12px 11px 12px;align-items:stretch}
.res .nm{font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .nm mark{background:color-mix(in srgb,var(--acc) 18%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.res .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.res .tag{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--src,var(--mute))}
.res .mc{font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--m) 14%,transparent);color:color-mix(in srgb,var(--m) 85%,var(--ink))}
.res .kc{text-align:right;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:2px}
.res .kc b{font-size:20px;font-weight:700;display:block}.res .kc small{font-size:11px;color:var(--mute)}
.res .rbtns{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.res .again{border:1px solid var(--acc);background:var(--acc-bg);color:var(--acc);border-radius:99px;padding:0 10px;min-height:44px;font-size:13px;font-weight:600;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.res .pl{flex:none;align-self:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500}
.rcp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--grid);font-size:14px}
.rcp button{border:0;background:none;color:var(--r);font-size:18px;padding:0 4px}
.step{display:flex;align-items:center;gap:12px}.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px}.step b{font-size:22px;min-width:30px;text-align:center}
.gl{display:grid;gap:6px;margin-top:10px}.gx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:52px;font:inherit}
.gx i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:700;color:#fff}
.gx span{display:flex;flex-direction:column;gap:1px}.gx b{font-size:15px;font-weight:600}.gx small{font-size:13px;color:var(--mute)}
.gx.on{background:color-mix(in srgb,var(--g) 10%,var(--card));border-color:color-mix(in srgb,var(--g) 40%,var(--line))}.gx.on i{background:var(--g);border-color:var(--g)}.gx.on b{text-decoration:line-through;color:var(--mute)}
.gprog{position:relative;margin-top:10px;height:22px;border-radius:99px;background:var(--grid);overflow:hidden;font-size:12px;font-weight:600}.gprog span{position:relative;z-index:1;display:block;text-align:center;line-height:22px}.gprog i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--g) 45%,transparent);transition:width .2s}
.act{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--grid);font-size:14px}
/* Bewertung, Einkaufsliste, Ideen */
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:8px;font-size:13px}.rate .lnk{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:50%;width:22px;height:22px;padding:0;font-size:12px;line-height:1}
.shopadd{display:flex;gap:8px;margin-bottom:12px}.shopadd .btn{flex:none;width:52px;font-size:22px;padding:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb6{margin-bottom:6px}.mb12{margin-bottom:12px}.my10{margin:10px 0}.fhd{margin:14px 0 0}
.amt-head{padding:12px 16px}.amt-head b{font-size:18px}.qs.c{justify-content:center}#qg{text-align:center;margin:4px 0 0}.btn.big{margin-top:14px;font-size:17px;padding:14px}.empty.pad{padding:14px 0}
.card.list{padding:12px 16px 4px}.card.list h2{margin-bottom:2px}.card.list .sw:first-of-type{border-top:0}.card.list s{color:var(--mute)}
.btn.idee{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;background:color-mix(in srgb,var(--acc) 10%,var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line));color:var(--acc)}.btn.idee small{color:var(--mute);font-weight:500}
.qs.mood{margin:0 0 8px}.btn.dis{text-align:left;margin-bottom:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.res.idea{cursor:pointer}.res .ibtns{display:flex;gap:6px;margin-top:6px}.res .ibtns .pl{width:38px;height:38px}.res .pl.sh{background:var(--acc-bg);font-size:17px}
/* Dashboard */
#dashf{position:fixed;left:0;right:0;width:100%;border:0;background:var(--bg);touch-action:pan-x pan-y}
.load{text-align:center;padding:60px 20px;color:var(--mute)}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);z-index:45;width:42px;height:42px;margin-left:-21px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.15);color:var(--mute);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transform:translateY(-30px);pointer-events:none;transition:opacity .15s}
#ptr.go{color:var(--acc);border-color:var(--acc)}#ptr.run{opacity:1;transform:translateY(20px);color:var(--acc);transition:transform .2s}#ptr.run i{animation:sp 1s linear infinite}#ptr i{font-style:normal;display:block}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ===================================================================================================
   Design 2026 v2 – futuristisch, aber ruhig wie bei Apple. Standard: Schwarz mit leuchtender Akzentfarbe
   (--a1/--a2, einstellbar unter Mehr → Design, siehe design.js). Glas nur für die Bedienebene.
   =================================================================================================== */
:root{--a1:#4fb6d6;--a2:#8b7bff;--bg:#000;--card:#0f1115;--card2:#151820;--ink:#f5f5f7;--mute:#8b8f98;--line:rgba(255,255,255,.08);--grid:rgba(255,255,255,.07);
 --fill:rgba(255,255,255,.08);--acc:var(--a1);--acc-bg:color-mix(in srgb,var(--a1) 18%,transparent);
 --g:#34d399;--y:#fbbf24;--r:#fb7185;--p:#a78bfa;--c:#fb923c;--f:#38bdf8;--rad:24px;color-scheme:dark;
 --gl-bg:rgba(22,24,30,.62);--gl-brd:rgba(255,255,255,.12);--gl-sh:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);
 --gl-blur:blur(26px) saturate(1.8);--sh-card:inset 0 1px 0 rgba(255,255,255,.05);--edge:rgba(255,255,255,.075);
 --cardbg:linear-gradient(165deg,rgba(255,255,255,.065),rgba(255,255,255,.02) 55%);--glow:0 0 18px color-mix(in srgb,var(--a1) 45%,transparent)}
:root[data-bg="grafit"]{--bg:#0b0d12;--card:#141720;--card2:#1b1f2a;--cardbg:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.025) 55%)}
:root[data-bg="hell"]{--bg:#f2f2f7;--card:#fff;--card2:#f7f7fa;--ink:#0b0b0f;--mute:#7c7f87;--line:rgba(60,60,67,.12);--grid:rgba(60,60,67,.08);--fill:rgba(118,118,128,.12);
 --g:#16a34a;--y:#d97706;--r:#e11d48;--p:#7c3aed;--c:#ea580c;--f:#0284c7;color-scheme:light;--edge:rgba(0,0,0,.05);
 --gl-bg:rgba(255,255,255,.68);--gl-brd:rgba(255,255,255,.85);--gl-sh:0 12px 30px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.9);
 --cardbg:#fff;--sh-card:0 1px 3px rgba(0,0,0,.05);--glow:0 0 14px color-mix(in srgb,var(--a1) 30%,transparent)}
:root[data-bg="hell"] .streak{color:#c2410c}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(108px + env(safe-area-inset-bottom))}
/* Polarlicht im Hintergrund – sehr dezent, in der Akzentfarbe */
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;z-index:-1;pointer-events:none;
 background:radial-gradient(40% 50% at 15% 10%,color-mix(in srgb,var(--a1) 22%,transparent),transparent 70%),radial-gradient(35% 45% at 90% 0%,color-mix(in srgb,var(--a2) 18%,transparent),transparent 70%);filter:blur(10px);opacity:.9}
:root[data-bg="hell"] body::before{opacity:.45}
main{padding:0 16px}#app>main.anim{animation:vin .32s cubic-bezier(.2,.8,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Symbole */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}.h2i{width:20px;height:20px;color:var(--acc);margin-right:2px}
/* Glas-Bausteine */
.top,.tabs,.drawer,.toast,.glassb,#dhint,#ptr{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
.top{padding:6px 10px;border-bottom:.5px solid transparent;transition:border-color .2s,background .2s;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
body.scrolled .top{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border-bottom-color:var(--line)}
.top:has(.dtl){background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
.top h1{font-size:17px;font-weight:600;letter-spacing:-.02em}.top h1.sm{opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
body.scrolled .top h1.sm{opacity:1;transform:none}
.ib{color:var(--acc);border-radius:99px}.ib .ic{width:24px;height:24px}.ib.txt{font-size:17px;font-weight:600;min-width:0;padding:0 10px}
.glassb{width:40px;min-width:40px;height:40px;margin:2px;border:.5px solid var(--gl-brd);box-shadow:var(--gl-sh),var(--glow)}.glassb svg{width:21px;height:21px;stroke-width:2.3}
.streak{border-radius:99px;font-size:15px;font-weight:700;background:color-mix(in srgb,#fb923c 16%,transparent);color:#fdba74;display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:.5px solid color-mix(in srgb,#fb923c 30%,transparent)}
.streak .ic{width:17px;height:17px}.streak.off{background:var(--fill);color:var(--mute);border-color:transparent}
.stat{margin:0 0 6px}.stat.q:not(.w){display:none}
/* große Titel */
.lt{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 4px 16px}.lt h2{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:0}
.lt small{display:block;color:var(--mute);font-size:15px;margin-top:4px;font-weight:500}
.grad{background:linear-gradient(100deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Karten: dunkle Paneele mit feiner Kante und Lichtkante oben */
.card,.tile,.res,.hint,.dnav,.mact button,.btn.idee,.btn.dis,.qs button,.chip2{background:var(--cardbg),var(--card);border:1px solid var(--edge)}
.card{border-radius:var(--rad);box-shadow:var(--sh-card);padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:700;letter-spacing:-.02em;align-items:center}.card h2 small{font-size:13px}
.card.list{padding:4px 16px}.card.list h2{margin:10px 0 2px}
.sec{font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--mute);margin:18px 6px 6px}
.hint{border-radius:20px;box-shadow:var(--sh-card);align-items:center}.hint>.ic{color:var(--acc);width:22px;height:22px}
.hint.acc{background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 16%,transparent),color-mix(in srgb,var(--a2) 8%,transparent)),var(--card);border-color:color-mix(in srgb,var(--a1) 30%,transparent)}
.hint.part{border-left:4px solid var(--y)}
.mlist{padding:2px 16px}.mrw+.mrw,.sw,.act,.cmp,.drow,.rcp{border-top:1px solid var(--line)}
.mic i{color:var(--acc)}.mic i .ic{width:24px;height:24px}.mhero i .ic{width:56px;height:56px;color:var(--acc)}
.mhero{background:radial-gradient(60% 80% at 50% 30%,color-mix(in srgb,var(--a1) 30%,transparent),transparent),var(--card);border:1px solid var(--edge)}
/* Knöpfe */
.btn{border:0;background:var(--fill);border-radius:99px;padding:12px 18px;font-weight:600;color:var(--acc);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.w{display:flex}.btn.p{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 70%,var(--a2)));color:#06080c;box-shadow:0 6px 20px color-mix(in srgb,var(--a1) 35%,transparent)}
:root[data-bg="hell"] .btn.p{color:#fff}
.btn.d{color:var(--r)}.btn.sm{padding:5px 12px;font-size:13px}.btn:active{transform:scale(.97)}
.row .btn{padding:11px 10px;border-radius:16px;font-size:15px}
.btn.idee,.btn.dis{border-radius:18px}
.today{border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#06080c;box-shadow:var(--glow)}
.mpl,.plus,.res .pl{background:linear-gradient(135deg,var(--a1),color-mix(in srgb,var(--a1) 60%,var(--a2)));color:#06080c;box-shadow:0 4px 14px color-mix(in srgb,var(--a1) 40%,transparent)}
:root[data-bg="hell"] .mpl,:root[data-bg="hell"] .plus,:root[data-bg="hell"] .res .pl{color:#fff}
.mpb{background:var(--fill);color:var(--acc)}
.mact button{border-radius:16px;color:var(--acc)}
.lnk2{border:0;background:none;color:var(--acc);font-weight:600;font-size:15px;padding:4px 2px}
/* Eingaben */
.inp{border:1px solid var(--edge);background:var(--fill);border-radius:14px;padding:12px 13px;color:var(--ink)}
.inp:focus{outline:2px solid color-mix(in srgb,var(--acc) 65%,transparent);outline-offset:0}
.inp.big{background:transparent;border:0;font-size:22px;font-weight:700;padding:6px 2px}.inp.big:focus{outline:0}
.inp.sm2{width:auto;padding:7px 10px;font-size:16px;border-radius:10px}textarea.inp{font:inherit;font-size:15px;resize:none}
select.inp{color:var(--ink)}
.seg{background:var(--fill);border-radius:14px;padding:3px;border:1px solid var(--edge)}.seg button{border-radius:11px;font-weight:500;font-size:13.5px;padding:7px 4px;color:var(--mute);transition:color .2s,background .2s}
.seg button.on{background:color-mix(in srgb,var(--a1) 20%,var(--card2));color:var(--ink);font-weight:650;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a1) 40%,transparent),0 0 16px color-mix(in srgb,var(--a1) 20%,transparent)}
:root[data-bg="hell"] .seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.qs button{box-shadow:none}.qs button.on{background:var(--acc);color:#06080c;border-color:var(--acc)}
.res{border-left:3px solid var(--src,var(--line));border-radius:18px}
/* Schalter */
.tgl,.tg input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;transition:background .2s,box-shadow .2s;margin:0;cursor:pointer;border:1px solid var(--edge)}
.tgl::after,.tg input[type=checkbox]::after{content:"";position:absolute;top:1px;left:1px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,.7,.4,1.2)}
.tgl:checked,.tg input[type=checkbox]:checked{background:var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--a1) 45%,transparent)}
.tgl:checked::after,.tg input[type=checkbox]:checked::after{transform:translateX(20px)}.tgl:disabled{opacity:.4}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:16px}
.card>.frow:first-child,.pnk>.frow:first-child,#pnBox>h2+.frow{border-top:0}.frow small.block{font-size:12.5px;margin-top:1px}.frow>span{min-width:0}
/* Bewertung gut/mittel/schlecht – deutlich */
.tone{display:inline-flex;align-items:center;gap:4px;padding:2px 9px 2px 6px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:0;white-space:nowrap}
.tone .ic{width:13px;height:13px;stroke-width:3}
.t-g{background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--g)}.t-y{background:color-mix(in srgb,var(--y) 18%,transparent);color:var(--y)}.t-r{background:color-mix(in srgb,var(--r) 18%,transparent);color:var(--r)}
.chip{font-weight:700;border-radius:99px;padding:3px 10px}
/* Untere Leiste: schwebende Glas-Kapsel mit Licht über dem aktiven Reiter */
.tabs{left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:560px;margin:auto;border:1px solid var(--gl-brd);border-radius:34px;padding:6px;box-shadow:var(--gl-sh);gap:2px;overflow:hidden;isolation:isolate}
.tabs button{position:relative;z-index:1;border-radius:28px;padding:8px 0 6px;font-size:10.5px;font-weight:600;gap:3px;color:var(--mute);transition:color .3s}

/* ===================================================================================================
   Soft Glass (Standard): Nachtblau, transparente Karten mit feinen Lichtreflexen.
   Blaues Licht nur an ausgewählten Stellen: Knöpfe, Fortschritte, aktiver Reiter.
   =================================================================================================== */
:root[data-bg="nacht"]{--bg:#070918;--card:rgba(255,255,255,.035);--card2:#12152c;--ink:#f3f4fb;--mute:#8d92ad;--line:rgba(255,255,255,.07);
 --fill:rgba(255,255,255,.06);--edge:rgba(255,255,255,.09);--gl-bg:rgba(20,23,48,.55);--gl-brd:rgba(255,255,255,.12);

:root{--trk:rgba(255,255,255,.07)}:root[data-bg="hell"]{--trk:rgba(0,0,0,.07)}
:root[data-bg="nacht"] body{background:linear-gradient(165deg,#0c1030 0%,#070918 38%,#05060f 70%,#0b0e2a 100%) fixed}
:root[data-bg="nacht"] body::before{background:radial-gradient(45% 40% at 10% 0%,color-mix(in srgb,var(--a1) 20%,transparent),transparent 70%),radial-gradient(40% 35% at 100% 25%,color-mix(in srgb,var(--a2) 12%,transparent),transparent 70%);opacity:.85}
/* Karten: Glas mit Lichtkante und weichem Reflex oben links – ohne Leuchten */
.card,.tile,.res,.hint,.dnav,.mact button,.btn.idee,.btn.dis,.mtile{position:relative;overflow:hidden;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.02),0 18px 40px -24px rgba(0,0,0,.8)}

/* ===================================================================================================
   Apple Health (Standard seit 19.11.2026) – Look der iOS-Health-App, nach Bildschirmaufnahme nachgebaut.
   Nur der Look: Aufbau und Funktionen bleiben gleich. Dunkel = „apple“, hell = „applehell“.
   design.js setzt dazu am <html>: data-ah (beide Apple-Stile) und data-acc (gewählte Akzentfarbe).
   Gliederung: 1 Farben · 2 Fläche & Farblicht · 3 Schrift & Zahlen · 4 Kopfzeile · 5 Karten · 6 Kennzahl-Karten
               7 Detailseite · 8 Hinweise · 9 Bedienelemente · 10 Untere Leiste · 11 Fenster & Menü · 12 Design-Vorschau
   =================================================================================================== */
/* ----- 1 Farben (gemessen an der Health-App: Karte #1c1c1e, Herz #ff2d55, Aktivität #ff4f12, Schlaf #646dff …) ----- */
:root[data-bg="apple"]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--ink:#fff;--mute:#8e8e93;--line:rgba(84,84,88,.55);--grid:rgba(84,84,88,.4);
 --fill:rgba(120,120,128,.24);--trk:rgba(120,120,128,.3);--edge:transparent;--seg-on:#636366;--press:#2c2c2e;--sheet:#000;--sheet-card:#1c1c1e;
 --g:#30d158;--y:#ffd60a;--r:#ff453a;--p:#bf5af2;--c:#ff9f0a;--f:#64d2ff;--rad:22px;color-scheme:dark;
 --cardbg:linear-gradient(transparent,transparent);--sh-card:none;--glow:none;
 --gl-bg:rgba(44,44,46,.72);--gl-brd:rgba(255,255,255,.1);--gl-sh:0 10px 30px rgba(0,0,0,.45);--gl-blur:blur(24px) saturate(1.8);--tab-on:rgba(255,255,255,.13);
 --hg1:#8b2436;--hg2:#7a2372;--hg-op:1;--avt:linear-gradient(160deg,#a5acc9,#6b73a8)}
:root[data-bg="applehell"]{--bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--ink:#000;--mute:#8a8a8e;--line:rgba(60,60,67,.16);--grid:rgba(60,60,67,.1);
 --fill:rgba(120,120,128,.14);--trk:rgba(120,120,128,.16);--edge:transparent;--seg-on:#fff;--press:#e5e5ea;--sheet:#f2f2f7;--sheet-card:#fff;
 --g:#34c759;--y:#ff9f0a;--r:#ff3b30;--p:#af52de;--c:#ff9500;--f:#32ade6;--rad:22px;color-scheme:light;
 --cardbg:linear-gradient(transparent,transparent);--sh-card:none;--glow:none;
 --gl-bg:rgba(255,255,255,.72);--gl-brd:rgba(0,0,0,.06);--gl-sh:0 8px 24px rgba(0,0,0,.12);--gl-blur:blur(24px) saturate(1.8);--tab-on:rgba(0,0,0,.06);
 --hg1:#ff8fa3;--hg2:#d79ce8;--hg-op:.45;--avt:linear-gradient(160deg,#b9bfd8,#7f87b8)}
:root[data-ah]{--num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* mit eigener Akzentfarbe färbt sie auch das Farblicht oben */
:root[data-ah]:not([data-acc="apple"]){--hg1:color-mix(in srgb,var(--a1) 62%,#000);--hg2:color-mix(in srgb,var(--a2) 55%,#000)}
:root[data-bg="applehell"]:not([data-acc="apple"]){--hg1:color-mix(in srgb,var(--a1) 45%,#fff);--hg2:color-mix(in srgb,var(--a2) 40%,#fff)}

/* ----- 2 Fläche & Farblicht: oben rot-violett wie die Health-Übersicht, scrollt mit weg ----- */
:root[data-ah]{background:var(--bg)}
:root[data-ah] body{background:transparent}
:root[data-ah] body::before{display:block;position:absolute;inset:0 0 auto 0;height:330px;z-index:-1;filter:none;opacity:var(--hg-op);
 background:linear-gradient(100deg,var(--hg1),var(--hg2));-webkit-mask-image:linear-gradient(#000 42%,transparent);mask-image:linear-gradient(#000 42%,transparent)}

/* ----- 3 Schrift & Zahlen: große Werte in runden Apple-Ziffern ----- */
:root[data-ah] :is(.mcb b,.mdh b,.sumg b,.gzk b,.gzrl b,.hero .kv b,.mac b,.tdhero b,.mgrid b,.wt b,.kp b,.arcc b,.top .dtl b,#app>.top h1,.lt h2,.drawer .ttl){font-family:var(--num)}
:root[data-ah] .hero svg text,:root[data-ah] .tdring text{font-family:var(--num)}
/* der große Titel steht in der Kopfzeile (Abschnitt 4) – im Inhalt nur noch die Unterzeile */
:root[data-ah] .lt{margin:0 4px 12px}
:root[data-ah] .lt h2{display:none}
:root[data-ah] .lt small{margin:0;font-weight:400;font-size:15px;color:var(--mute)}
:root[data-ah] .sec{font-size:22px;font-weight:700;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:26px 4px 10px}
:root[data-ah] .grad{background:none;color:var(--acc);-webkit-background-clip:border-box;background-clip:border-box}

/* ----- 4 Kopfzeile: großer linker Titel, beim Scrollen kleiner mittiger Titel auf Glas; rechts runder Profilkreis ----- */
.avt,.mini-a{display:none}
:root[data-ah] .top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;border-bottom:.5px solid transparent;transition:background .25s,border-color .25s}
:root[data-ah] .top h1{font-size:17px;font-weight:600}
:root[data-ah] .top h1.sm{opacity:1;transform:none}
:root[data-ah] .ib{color:var(--acc)}
:root[data-ah] .glassb{background:var(--gl-bg);border:.5px solid var(--gl-brd);box-shadow:var(--gl-sh);color:var(--ink)}
/* Hauptseiten */
:root[data-ah] #app>.top{padding:8px 12px 4px 18px;min-height:58px}
:root[data-ah] #app>.top>h1{order:0;flex:1;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15;text-align:left;padding:0}
:root[data-ah] #app>.top>h1.long{font-size:28px}
:root[data-ah] #app>.top>.streak,:root[data-ah] #app>.top>.glassb,:root[data-ah] #app>.top>span:last-child{order:2}
/* rechte Gruppe (Streak/Plus + Profil) bleibt immer rechts, auch wenn der Titel beim Scrollen in die Mitte rückt */
:root[data-ah] #app>.top>:is(.streak,.glassb){margin-left:auto}

 const cnt={g:0,y:0,r:0};got.forEach(x=>x.grade&&cnt[x.grade]++);

  <div><span class="s mute">Ø Bilanz zu Garmin</span><b style="display:block;font-size:20px" class="${bal>0?"warn":""}">${bal==null?"–":(bal>0?"+":"−")+n0(Math.abs(bal))}</b></div>
  <div><span class="s mute">Ø Protein</span><b style="display:block;font-size:20px">${n0(av(x=>x.s.p))} <small class="mute">g</small></b></div></div>
  <div class="wk">${L.map(x=>`<div>${x.has?`<i style="height:${x.s.kcal/mx*100}%;background:${x.part?"var(--mute)":COL[x.done?x.grade||"acc":"acc"]};opacity:${x.part?.35:x.done?1:.5}"></i>`:""}<em style="bottom:${x.t.kcal/mx*100}%"></em></div>`).join("")}</div>
  <div class="wkl">${L.map((x,k)=>`<span>${range<=7?wd(x.d):range<=14?(k%2?"":x.d.slice(8)):(k%5?"":x.d.slice(8))}</span>`).join("")}</div>
  <p class="s mute" style="margin:8px 0 0">Balken = gegessen · Strich = Ziel · <span style="color:var(--g)">${cnt.g} grün</span> · <span style="color:var(--y)">${cnt.y} orange</span> · <span style="color:var(--r)">${cnt.r} rot</span></p></div>
 <div class="card">${L.slice().reverse().map(x=>`<div class="drow" data-open="${x.d}"><span>${wd(x.d)} ${dm(x.d)}</span><span>${x.has?`<b>${n0(x.s.kcal)}</b> <span class="mute">/ ${n0(x.t.kcal)} kcal · P ${n0(x.s.p)} g${x.part?" · zu wenig eingetragen":""}</span>`:`<span class="mute">nicht erfasst</span>`}</span>
  <span>${x.done&&x.grade?`<span class="chip" style="--c0:${COL[x.grade]}">${x.grade==="g"?ic("check"):x.grade==="y"?ic("warn"):ic("x")}</span>`:""}</span></div>`).join("")}</div>
 <p class="foot">Ampel im Verlauf: Kalorien ±10 % und Protein ab 90 % = grün, ±20 % bzw. ab 75 % = orange, sonst rot. Tage mit weniger als 50 % des Kalorienziels gelten als unvollständig eingetragen: ohne Ampel und nicht in den Durchschnitten.</p>`}

/* ===== Mein Tag (kompakte Garmin-Ansicht) ===== */
const EMO={running:ic("run"),trail_running:ic("run"),treadmill_running:ic("run"),cycling:ic("bike"),indoor_cycling:ic("bike"),strength_training:ic("gym"),walking:ic("walk"),hiking:ic("hike"),swimming:ic("swim")};
const EMOP={gym:ic("gym"),run:ic("run"),rest:ic("moon"),flex:ic("run"),race:ic("flag")};
/* Passt eine Aktivität zur geplanten Einheit? Gleiche Regeln wie im Dashboard (isRun/isGym):
   Lauf/Wettkampf nur mit Laufen, Gym nur mit Krafttraining. Kurze Radfahrten (Schulweg) zählen nie als Training.
   Flexibel/Ruhetag: Laufen, Kraft oder eine andere Sporteinheit ab 20 Min (Rad erst ab 30 Min, Gehen/Motorrad nie). */
const isRunA=a=>/running/.test(a.type||""),isGymA=a=>/strength|fitness_equipment|hiit|indoor_cardio/.test(a.type||"");
const isSportA=a=>isRunA(a)||isGymA(a)||(!/cycling|e_bike|walking|motorcycl/.test(a.type||"")&&a.min>=20)||(/cycling/.test(a.type||"")&&a.min>=30);
const planHit=(pd,a)=>!pd?isSportA(a):pd.type==="run"||pd.type==="race"?isRunA(a):pd.type==="gym"?isGymA(a):isSportA(a);
const planActs=(d,pd)=>(C.store&&C.store.acts||[]).filter(a=>a.date===d&&planHit(pd,a));
function planDay(d){const P=C.plan&&C.plan.days||{},p=P[d];if(!p)return null;let n={...p};
 for(const x of(C.anp&&C.anp.items||[]).filter(y=>y.date===d)){const j=x.jetzt||{};if(j.type&&j.type!==p.type&&j.type!=="rest")continue;
  ["title","dur","km","desc"].forEach(f=>{if(j[f]!==undefined)n[f]=j[f]});if(j.type==="rest")n.type="rest";if(x.zusatz)n.desc=(n.desc||"")+" · Zusatz: "+x.zusatz;n.adj=x.grund||"angepasst"}
 return n}
const lastV=(f,maxAge=3)=>{const D=C.store&&C.store.days||{};for(let k=0;k<=maxAge;k++){const d=EK.add(TODAY(),-k);if(D[d]&&D[d][f]!=null)return{v:D[d][f],d,row:D[d]}}return null};
const avgV=(f,n)=>{const D=C.store&&C.store.days||{},v=[];for(let k=1;k<=n;k++){const x=D[EK.add(TODAY(),-k)];if(x&&x[f]!=null)v.push(x[f])}return v.length>=7?v.reduce((a,b)=>a+b,0)/v.length:null};
const ago=d=>d===TODAY()?"heute":d===EK.add(TODAY(),-1)?"gestern":dm(d);
/* Kachel mit Ampelfarbe (g/y/r) */
/* sa = eigene Farbe für die Unterzeile (z. B. Schlaf-Score grün, Dauer unter 7 h orange) */
const tile=(l,v,u,sub,a,sa)=>{const sc=sa!==undefined?sa:a;return`<div class="tile" style="${a?`border-left:4px solid ${COL[a]}`:""}"><span>${l}</span><b style="${a?`color:color-mix(in srgb,${COL[a]} 75%,var(--ink))`:""}">${v}${u?` <small>${u}</small>`:""}</b><em style="color:${sc?COL[sc]:"var(--mute)"}">${sub||"&nbsp;"}</em></div>`};
/* Fließtext → Stichpunkte (an Satzenden und Semikolons) */
const bullets=t=>`<ul class="s" style="margin:0;padding-left:18px;display:grid;gap:4px">${String(t).split(/(?<=[.!])\s+(?=[A-ZÄÖÜ0-9])|;\s*/).map(x=>x.trim()).filter(Boolean).map(x=>`<li>${h(x)}</li>`).join("")}</ul>`;
/* ===== Gym-Checkliste: Übungen aus der Plan-Beschreibung, sortiert nach Geräte-Reihenfolge im Studio =====
   Gespeichert in data/ernaehrung/gym.json {"JJJJ-MM-TT":[Übungsschlüssel,…]}. Reihenfolge ändern = GYM_ORDER umstellen. */
const GYM_ORDER=[/beinpresse/,/rückenstreck/,/beinstreck/,/beinbeug/,/adduktor/,/abduktor/,/wade/,/bizeps/,/trizeps/,/schulterpresse/,/seitheb/,/^butterfly/,/brustpresse/,/reverse butterfly/,/rudern/,/latzug/,null,/klimmz[uü]g|dead hang/,/bauch/,/rad\b|laufband|crosstrainer|ergometer/];
const gymRank=n=>{n=n.toLowerCase();const i=GYM_ORDER.findIndex(r=>r&&r.test(n));return i<0?-1:i};
function gymList(desc){const items=[],notes=[],CARDIO=/\b(Rad|Laufband|Crosstrainer|Ergometer)\b/;
 const note=t=>{t=t.trim().replace(/[.;]$/,"");if(t)notes.push(t)};
 const push=t=>{t=t.trim().replace(/[.;]$/,"").replace(/^danach\s+/i,"");if(!t)return;
  if(CARDIO.test(t)&&/\bMin\b/.test(t)){const m=t.match(/\d+(–\d+)?\s*Min/);items.push({name:t.replace(/\d+(–\d+)?\s*Min\.?\s*/,"").trim(),sets:m?m[0]:""});return}
  let m=t.match(/^(.*?)\s+((?:\d+(?:–\d+)?\s*×|\d+(?:–\d+)?\s+Sätze).*)$/),name=m?m[1]:t,sets=m?m[2]:"";name=name.replace(/\s+je$/,"");
  if(gymRank(name)<0&&!m)return note(t);
  /* „Bizeps/Trizeps je 2×12“, „Seitheben, Bizeps, Trizeps je 2×12“ → einzelne Übungen, wenn sie an verschiedenen Geräten sind */
  const parts=name.split(/\s*\/\s*|,\s+/),rs=parts.map(gymRank);
  if(parts.length>1&&rs.every(r=>r>=0)&&new Set(rs).size===parts.length)parts.forEach(x=>items.push({name:x,sets}));else items.push({name,sets})};
 for(const seg of String(desc||"").split(/\s+·\s+/))for(let part of seg.split(/(?<=\.)\s+(?=[A-ZÄÖÜ0-9])/)){
  part=part.trim();if(!part)continue;
  if(/^(Woche|RIR|Ziel|DELOAD|Phase)\b/i.test(part)){note(part);continue}
  let m=part.match(/^Superset\s+(.+?)\s+je\s+(.+)$/i);if(m){m[1].split(/\s*\+\s*/).forEach(x=>push(x+" "+m[2]));continue}
  m=part.match(/^([^:]{1,40}):\s*(.+)$/);
  if(m){if(/^(Finisher|.*Block)$/i.test(m[1]))part=m[2];else if(gymRank(m[1])<0&&gymRank(m[2])>=0)part=m[2];else{note(part);continue}}
  if(!/×|\bMin\b|Sätze/.test(part)&&gymRank(part)<0){note(part);continue}
  part.split(/(?<=×[^,]*),\s+(?=[A-ZÄÖÜ])|\s+\+\s+/).forEach(push)}
 const nul=GYM_ORDER.indexOf(null);
 items.forEach((x,i)=>{x.key=x.name.toLowerCase().replace(/\s+/g," ");const r=gymRank(x.name);x.r=r<0?nul:r;x.i=i});
 items.sort((a,b)=>a.r-b.r||a.i-b.i);return{items,notes}}
const gymDone=d=>new Set((C.gym||{})[d]||[]);
function gymCheck(d,desc,open){const{items,notes}=gymList(desc);if(!items.length)return"";const D=gymDone(d),n=items.filter(x=>D.has(x.key)).length;
 return`<div class="gprog"><span>${n===items.length?`${ic("check")} Alles erledigt`:`${n} von ${items.length} erledigt`}</span><i style="width:${Math.round(n/items.length*100)}%"></i></div>
 <div class="gl">${items.map(x=>{const on=D.has(x.key);return`<button class="gx${on?" on":""}" data-gym="${d}|${h(x.key)}"><i>${on?ic("check"):""}</i><span><b>${h(x.name)}</b>${x.sets?`<small>${h(x.sets)}</small>`:""}</span></button>`}).join("")}</div>
 ${notes.length?`<details class="more"${open?" open":""}><summary>Hinweise ›</summary>${bullets(notes.join(". ")+".")}</details>`:""}`}
/* ===== Trainingsplan (Plan + nächtliche/mittägliche Anpassungen) ===== */
function vPlan(){
 if(!C.plan)return`<div class="card">Noch kein Trainingsplan geladen.</div>`;
 const T=TODAY(),mon=EK.add(T,-((new Date(T+"T12:00:00").getDay()+6)%7)),A=C.anp||{},items=A.items||[];
 let o=A.fazit?`<div class="card"><h2>Einschätzung & Anpassungen<small>${h(A.stand||"")}</small></h2>${bullets(A.fazit)}
  <p class="s mute" style="margin:8px 0 0">Die Anpassung läuft automatisch jeden Mittag (Mo–Fr 12:00, Sa/So 11:00) aus Schlaf, HRV, Ruhepuls und Body Battery. Die Art der Einheit bleibt gleich, Freitag bleibt Ruhetag.</p></div>`:"";
 for(let k=0;k<14;k++){const d=EK.add(mon,k),pd=planDay(d),orig=(C.plan.days||{})[d],it=items.find(x=>x.date===d),acts=planActs(d,pd),other=(C.store&&C.store.acts||[]).filter(a=>a.date===d&&!acts.includes(a)&&a.min>=5);
  if(k===7)o+=`<div class="sec">Nächste Woche</div>`;else if(k===0)o+=`<div class="sec">Diese Woche</div>`;
  if(!pd){o+=`<div class="card" style="padding:10px 14px;opacity:.7"><b>${ddm(d)}</b> <span class="mute s">– kein Eintrag</span></div>`;continue}
  const done=acts.length>0,past=d<T,st=pd.type==="rest"?(done?"Aktivität am Ruhetag":""):past?(done?"erledigt":"verpasst"):d===T?(done?"erledigt":"heute"):"",
   sc=st==="erledigt"?"var(--g)":st==="verpasst"?"var(--r)":"var(--acc)";
  const title=String(pd.title||"").replace(/^\S+\s/,""),meta=[pd.start&&pd.start+" Uhr",pd.dur&&pd.dur+" Min",pd.km&&pd.km+" km"].filter(Boolean).join(" · ");
  o+=`<div class="card" style="padding:12px 14px;${d===T?"border:2px solid var(--acc)":""}${past?";opacity:.75":""}"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
   <span><span class="s mute">${ddm(d)}</span><br><b style="font-size:16px">${EMOP[pd.type]||"•"} ${h(pd.type==="rest"?"Ruhetag":title)}</b></span><span class="s" style="color:${sc};white-space:nowrap">${st}</span></div>
   ${meta?`<div class="s mute">${meta}</div>`:""}
   ${it?`<div class="gzadj" style="margin-top:6px">↻ Angepasst${it.vorher&&it.vorher.title?`: vorher „${h(String(it.vorher.title).replace(/^\S+\s/,""))}“`:""}${it.grund?`<br><span style="color:var(--ink)">${h(it.grund)}</span>`:""}</div>`:""}
   ${pd.type==="gym"&&gymList(pd.desc).items.length?(d===T?gymCheck(d,pd.desc):`<details class="more"><summary>Übungen${gymDone(d).size?` (${gymDone(d).size} erledigt)`:""} ›</summary>${gymCheck(d,pd.desc)}</details>`):pd.desc?`<details class="more"><summary>Details ›</summary><p class="s" style="margin:6px 0 0">${h(pd.desc)}</p></details>`:""}
   ${acts.length||other.length?`<div class="s mute" style="margin-top:6px">${[...acts,...other].map(a=>`<span${acts.includes(a)?"":' style="opacity:.55" title="zählt nicht als Einheit"'}>${EMO[a.type]||ic("bolt")} ${a.km?n1(a.km)+" km · ":""}${Math.round(a.min)} min</span>`).join(" · ")}</div>`:""}</div>`}
 return o+`<p class="foot">Der Plan selbst (data/plan.json) wird nie automatisch geändert – Anpassungen liegen als eigene Ebene darüber. Größere Änderungen besprechen wir im Chat.</p>`}

function wizCalc(){const p={...prof(),job:W.job,rate:W.rate,adj:null},g=G(),b=EK.bases(p,g),base=b.garmin!=null?b.garmin:b.formel,src=b.garmin!=null?"garmin":"formel";
 let adj=Math.round(W.rate*1100),floored=false;if(base+adj<b.bmr){adj=Math.round(b.bmr-base);floored=true}
 let tr=0;if(b.garmin!=null&&b.aktiv!=null)tr=b.aktiv;else{for(let k=0;k<7;k++)tr+=EK.planKcal(planDay(EK.add(TODAY(),k)),p.weight);tr/=7}
 const w=p.weight,ziel=+String(W.ziel).replace(",",".")||null,weeks=ziel&&W.rate?Math.abs((w-ziel)/W.rate):null;
 return{b,base,src,adj,floored,tr,day:base+adj,avg:base+adj+tr,w,ziel,weeks,dirOk:!ziel||!W.rate||Math.sign(ziel-w)===Math.sign(W.rate)}}

 <div class="cmp"><span>${r.src==="garmin"?"Ruheverbrauch (ohne Bewegung)":"Alltagsverbrauch ohne Training"}</span><b>${n0(r.base)} kcal <small class="mute">${r.src==="garmin"?"gemessen":"geschätzt"}</small></b></div>

 <p class="s mute" style="margin:0">${(EK.RATES.find(x=>x[0]===W.rate)||[0,""])[1]}</p>
 <label class="f">Zielgewicht (kg)</label><input class="inp" id="wziel" type="text" inputmode="decimal" value="${W.ziel!==""&&W.ziel!=null?String(W.ziel).replace(".",","):""}" placeholder="z. B. 75">
 ${r.src==="formel"?`<label class="f">Alltag (noch keine Garmin-Messung)</label><select class="inp" id="wjob">${EK.JOBS.map(j=>`<option value="${j[0]}" ${j[0]===W.job?"selected":""}>${j[2]}</option>`).join("")}</select>`:""}</div>

 <div class="cmp"><span>${r.src==="garmin"?"Ruheverbrauch":"Alltagsverbrauch"}</span><b>${n0(r.base)} kcal</b></div><div class="cmp"><span>${r.adj<0?"Defizit":"Überschuss"}</span><b>${r.adj>0?"+":"−"}${n0(Math.abs(r.adj))} kcal</b></div>

 ${Math.abs(W.rate)>0.5?`<p class="s warn" style="margin:6px 0 0">Mit Marathontraining ist mehr als 0,5 kg pro Woche hart: Regeneration und Leistung leiden schnell.</p>`:""}

const shopName=s=>String(s||"").split(/,\s/)[0].trim()||String(s||"");
const rg=g=>g<100?Math.round(g/5)*5||Math.round(g):Math.round(g/10)*10;
/* Zutaten → Einkaufs-Todos (die eigene Einkaufsliste gibt es nicht mehr) */
const addToShop=(list,von)=>tdShop(list,von);
function dishShop(f,portions){const fac=portions/(f.portionen||1);
 const n=addToShop((f.zutaten||[]).map(z=>({name:z.name,g:z.g*fac,stk:z.stk?z.stk*fac:undefined})),f.name);
 toast(n?`${n} Zutat${n>1?"en":""} als Einkaufs-Todos angelegt`:"Steht schon alles auf deinen Todos",4000,n?"Ansehen":null,()=>{closeSheet();go("todos")})}

/* ===== Wischen zum Schließen =====
   Fenster (Mahlzeit, Suche, Menge, Formulare …): nach rechts wischen oder – ganz oben – nach unten ziehen = der Knopf oben links
   (Zurück bzw. Schließen). Formulare mit ungespeicherten Eingaben und ein angefangenes Gericht lassen sich so nicht wegwischen.
   Seitenmenü: nach links wischen schließt, vom linken Bildschirmrand nach rechts wischen öffnet es. */
let SG=null;const SGX=90,SGY=110,EDGE=22;
const sheetBack=sh=>sh.querySelector(".top [data-close],.top [data-mclose],.top [data-back]");
/* ungespeicherte Eingaben? (Wert weicht vom Ausgangswert ab) */
function sheetDirty(sh){const fm=sh.querySelector("#ff,#mf,#tdf");
 if(fm&&[...fm.elements].some(e=>(e.tagName==="INPUT"||e.tagName==="TEXTAREA")&&e.type!=="hidden"&&e.type!=="file"&&(e.type==="checkbox"||e.type==="radio"?e.checked!==e.defaultChecked:e.value!==e.defaultValue)))return true;
 return !!(sh.querySelector("#rname")&&R&&(R.items.length||($("rname").value||"").trim()||($("ranl")&&$("ranl").value.trim())))}
document.addEventListener("touchstart",ev=>{SG=null;if(ev.touches.length>1)return;const t=ev.touches[0],sh=$("sheet"),dr=$("drawer"),tg=ev.target;
 if(dr.classList.contains("on")){SG={k:"drawer",x:t.clientX,y:t.clientY,t:Date.now(),lock:null,dx:0,dy:0};return}
 if(sh.classList.contains("on")){if(!sh.contains(tg))return;const sw=tg.closest(".swc");
  SG={k:"sheet",x:t.clientX,y:t.clientY,t:Date.now(),lock:null,dx:0,dy:0,top:sh.scrollTop<=0,
   nox:!!tg.closest(".units,textarea,select,video")||tg===document.activeElement||!!(sw&&sw.dataset.swopen),noy:!!tg.closest("textarea,select,video"),dirty:sheetDirty(sh)};return}
 if(t.clientX<=EDGE&&CFG.token&&$("app").contains(tg)){SD=null;SG={k:"edge",x:t.clientX,y:t.clientY,t:Date.now(),lock:null,dx:0,dy:0}}},{passive:true});
document.addEventListener("touchmove",ev=>{if(!SG)return;if(ev.touches.length>1){sgEnd(false);return}
 const t=ev.touches[0],dx=t.clientX-SG.x,dy=t.clientY-SG.y;SG.dx=dx;SG.dy=dy;
 if(SG.lock==null&&(Math.abs(dx)>10||Math.abs(dy)>10)){const hor=Math.abs(dx)>Math.abs(dy)*1.3,ver=Math.abs(dy)>Math.abs(dx)*1.3;
  SG.lock=SG.k==="sheet"?(hor&&dx>0&&!SG.nox?"x":ver&&dy>0&&SG.top&&!SG.noy&&$("sheet").scrollTop<=0?"y":"no"):SG.k==="drawer"?(hor&&dx<0?"x":"no"):(hor&&dx>0?"x":"no");
  if(SG.lock==="no"){SG=null;return}
  if(SG.k==="sheet"){SW=null;$("sheet").classList.remove("snapb","backin");$("sheet").classList.add("dragg")}
  else{if(SG.k==="edge"){SD=null;PT=null;openDrawer()}$("drawer").classList.add("dragg")}}
 if(!SG.lock)return;if(ev.cancelable)ev.preventDefault();
 if(SG.k==="sheet"){const sh=$("sheet"),f=SG.dirty?.12:1;
  sh.style.transform=SG.lock==="x"?`translateX(${Math.max(0,dx)*f}px)`:`translateY(${Math.max(0,dy)*.7*f}px)`}
 else{const dr=$("drawer"),w=dr.offsetWidth;dr.style.transform=`translateX(${SG.k==="edge"?Math.min(0,-w+Math.max(0,dx)*1.2):Math.min(0,dx)}px)`;
  $("scrim").style.opacity=String(Math.max(0,Math.min(1,SG.k==="edge"?dx*1.2/w:1+dx/w)))}},{passive:false});
function sgEnd(done){const g=SG;SG=null;if(!g||!g.lock)return;const fast=Date.now()-g.t<260;
 if(g.k==="sheet"){const sh=$("sheet"),x=g.lock==="x",go=done&&!g.dirty&&(x?(g.dx>SGX||(fast&&g.dx>45)):(g.dy>SGY||(fast&&g.dy>60)));
  sh.classList.remove("dragg");sh.classList.add("snapb");
  if(!go){sh.style.transform="";setTimeout(()=>sh.classList.remove("snapb"),240);if(done&&g.dirty&&(x?g.dx>SGX:g.dy>SGY))toast("Erst speichern oder mit ✕ verwerfen");return}
  sh.style.transform=x?"translateX(100%)":"translateY(100%)";
  setTimeout(()=>{sh.classList.remove("snapb");sh.classList.add("quiet");sh.style.transform="";const b=sheetBack(sh);if(b)b.click();else closeSheet();
   /* Zurück innerhalb des Fensters (z. B. Menge → Suche): neuen Inhalt kurz von links einblenden */
   setTimeout(()=>{if(sh.classList.contains("on")){sh.classList.add("backin");setTimeout(()=>sh.classList.remove("backin","quiet"),220)}else sh.classList.remove("quiet")},20)},190);return}
 const dr=$("drawer"),w=dr.offsetWidth;dr.classList.remove("dragg");dr.style.transform="";$("scrim").style.opacity="";
 if(g.k==="edge"){if(!(done&&(g.dx*1.2>w*.4||(fast&&g.dx>40))))closeDrawer()}
 else if(done&&(g.dx<-w*.3||(fast&&g.dx<-40)))closeDrawer()}

/* ===== Garmin-Sync anstoßen ===== */
/* Automatisch beim Öffnen: Garmin-Stand älter als 2 h → Cloud-Sync anstoßen (geplante GitHub-Läufe kommen oft Stunden zu spät).
   Höchstens 1× pro Stunde, nie während ein Sync läuft. */
function autoSync(){const sy=C.store&&C.store.synced;if(!sy||!CFG.token||Date.now()/1000-sy<2*3600||syncSince())return;
 if(Date.now()-LS.get("autosync",0)<36e5)return;LS.set("autosync",Date.now());syncGarmin(true)}
/* Sperre gegen Doppeltipp: Zeitpunkt des Starts in localStorage (max. 5 Min.), vor dem Start Prüfung auf einen schon laufenden Lauf */
const SYNC_LOCK=5*60e3,syncSince=()=>{const t=LS.get("sync",0);return t&&Date.now()-t<SYNC_LOCK?t:0},hhmm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
async function syncGarmin(auto){closeDrawer();
 const since=syncSince();if(since)return auto?null:toast(`Sync läuft bereits (seit ${hhmm(since)}) – neue Werte in Kürze`,3500);
 LS.set("sync",Date.now());
 const unlock=()=>LS.set("sync",0);
 try{let active=false;
  try{const r=await gh("/actions/workflows/garmin-sync.yml/runs?per_page=5");if(r.ok){const j=await r.json();active=(j.workflow_runs||[]).some(x=>x.status==="queued"||x.status==="in_progress"||x.status==="waiting")}}catch(e){if(e.auth)throw e}
  if(active){if(!auto)toast("Sync läuft bereits – neue Werte in Kürze",3500)}
  else{const r=await gh("/actions/workflows/garmin-sync.yml/dispatches",{method:"POST",body:JSON.stringify({ref:CFG.branch})});
   if(r.status===403){unlock();return toast("Token darf keine Actions starten – Berechtigung „Actions: Read and write“ ergänzen",4500)}
   if(!r.ok){unlock();return toast("Sync konnte nicht gestartet werden ("+r.status+")")}
   /* automatisch: kein Hinweis über dem Inhalt – die Statuszeile zeigt „wird aktualisiert“ */
   if(!auto)toast("Garmin-Sync gestartet – neue Werte in 1–2 Minuten",3500)}
  setStatus();
  const before=C.store&&C.store.synced;let n=0;
  const poll=async()=>{if(++n>8){unlock();return setStatus()}try{const st=await getRaw("data/store.json");if(st&&st.synced!==before){unlock();await loadAll();return auto?null:toast("Garmin-Daten aktualisiert")}}catch(e){}setTimeout(poll,30000)};
  setTimeout(poll,60000)}
 catch(e){unlock();toast(e.auth?e.message:"Keine Verbindung")}}

function showSetup(err){
 $("app").innerHTML=`<div class="top"><span style="min-width:42px"></span><h1>Einrichten</h1><span style="min-width:42px"></span></div><main>
 <div class="card"><p style="margin-top:0">Die App speichert dein Ernährungstagebuch in deinem GitHub-Repo – dort holt es sich auch das Dashboard. Dafür braucht sie einmalig einen GitHub-Token.</p>
 ${err?`<p style="color:var(--r)">${h(err)}</p>`:""}
 <form id="sf"><label class="f">Repository</label><input class="inp" name="repo" value="${h(CFG.repo)}" autocapitalize="off" autocorrect="off">
 <label class="f">GitHub-Token (fine-grained, beginnt mit github_pat_)</label><input class="inp" name="token" type="password" value="" placeholder="github_pat_…" autocapitalize="off" autocorrect="off">
 <button class="btn p w" style="margin-top:14px" type="submit">Verbinden</button></form>
 <p class="s mute">Der Token bleibt nur auf diesem iPhone gespeichert. Rechte, nur für dieses eine Repository: Contents „Read and write“, Actions „Read and write“.</p></div></main>`}
async function setup(f){const repo=f.elements.repo.value.trim(),token=f.elements.token.value.trim();if(!repo||!token)return toast("Repo und Token angeben");
 CFG={...CFG,repo,token};
 try{const r=await gh("");if(r.status===404){CFG.token="";return showSetup("Repo nicht gefunden – Name prüfen oder dem Token Zugriff auf dieses Repo geben.")}
  const j=await r.json();if(j.permissions&&!j.permissions.push){CFG.token="";return showSetup("Der Token darf nicht schreiben – Contents „Read and write“ setzen.")}
  CFG.branch=j.default_branch||"main";LS.set("cfg",CFG);toast("Verbunden");render();loadAll()}
 catch(e){CFG.token="";showSetup(e.message||"Keine Verbindung")}}

 else if(x=b("[data-qd]")){readQ();const st=A.u.k==="g"?10:A.u.k==="pack"?.25:A.u.k==="smart"&&A.q<=1&&+x.dataset.qd<0?.5:1;setQ(Math.max(st>=1?1:st,A.q+(+x.dataset.qd)*st))}
 else if(x=b("[data-qset]"))setQ(+x.dataset.qset);
 else if(x=b("[data-meal]")){A.meal=x.dataset.meal;document.querySelectorAll("[data-meal]").forEach(y=>y.classList.toggle("on",y===x))}
 else if(b("[data-save]"))saveAmount();
 else if(b("[data-fav]"))toggleFav();
 else if(b("[data-sync]"))syncGarmin();
 else if(b("[data-reload]"))loadAll();
 else if(b("[data-blsload]")){loadBls(true);suLoadOff(true)}
 else if(b("[data-logout]")){if(confirm("Token von diesem iPhone entfernen?")){CFG.token="";LS.set("cfg",CFG);showSetup()}}});
document.addEventListener("input",ev=>{if(ev.target.id==="ranl"&&R)R.anleitung=ev.target.value;else if(ev.target.id==="wziel"&&W)W.ziel=ev.target.value;else if(ev.target.id==="rname"&&R)R.name=ev.target.value;else if(ev.target.id==="lmq"){LMQ=ev.target.value;clearTimeout(lmRefresh.t);lmRefresh.t=setTimeout(lmRefresh,100)}else if(ev.target.id==="q"){S.q=ev.target.value;S.bmore=false;clearTimeout(results.t);results.t=setTimeout(results,120)}else if(ev.target.id==="qv"){readQ();nut()}});
document.addEventListener("change",ev=>{if(ev.target.dataset&&ev.target.dataset.pushuhr){setProf({erinnerung:{an:true,...((C.profil||{}).erinnerung||{}),uhr:+ev.target.value}});toast("Erinnerung ab "+ev.target.value+":00 Uhr");return}if(ev.target.id==="lblfile"){const fl=ev.target.files&&ev.target.files[0];ev.target.value="";if(fl)labelPhoto(fl);return}if(W&&ev.target.id==="wjob"){W.job=ev.target.value;renderWizard();return}if(R&&ev.target.id==="rspread"){R.spread=ev.target.checked;renderRecipe();return}if(R&&ev.target.id==="rkeep"){R.keep=ev.target.checked;return}if(ev.target.name==="fixon"&&fid(ev.target.form)==="pf")saveProfil(ev.target.form)});
/* Formular-Kennung immer über das Attribut lesen: Ein Feld mit name="id" (Lebensmittel-Formular) überdeckt sonst form.id –
   genau deshalb ließ sich ein neues Lebensmittel nicht speichern. */
const fid=f=>f&&f.getAttribute?f.getAttribute("id"):"";
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,id=fid(f);
 if(id==="pf")saveProfil(f);else if(id==="mf")saveManual(f);else if(id==="sf")setup(f);
 else if(id==="ff")saveFoodForm(f);
 else if(id==="dislf")dislikeAdd()});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="ean")byBarcode(ev.target.value)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;
 if(cur<TODAY()&&!$("sheet").classList.contains("on")&&Date.now()-C.ts>6*36e5)cur=TODAY();
 if(Date.now()-C.ts>60000)refreshIfChanged();else flush()});
addEventListener("online",flush);

/* Kein Zoomen wie auf einer Webseite: Pinch (iOS-Gesten, Zwei-Finger-Bewegung) und Doppeltipp sperren – auch im Dashboard-Rahmen */
function noZoom(doc){const stop=e=>{if(e.cancelable)e.preventDefault()},two=e=>{if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault()};
 ["gesturestart","gesturechange","gestureend"].forEach(t=>doc.addEventListener(t,stop,{passive:false}));
 /* zweiter Finger: schon beim Aufsetzen abbrechen (während des Rollens lässt sich touchmove nicht mehr abbrechen) */
 doc.addEventListener("touchstart",two,{passive:false});doc.addEventListener("touchmove",two,{passive:false});
 try{doc.documentElement.style.touchAction="pan-x pan-y"}catch(e){}}
noZoom(document);
/* Sicherheitsnetz: Ist die Seite trotzdem vergrößert (z. B. Pinch mitten im Rollen, im Dashboard-Rahmen), sofort zurück auf 100 % */
(function(){const vv=window.visualViewport,mv=document.querySelector('meta[name="viewport"]');if(!vv||!mv)return;const base=mv.content;let t=null;
 const fix=()=>{if(vv.scale>1.01){clearTimeout(t);t=setTimeout(()=>{if(vv.scale<=1.01)return;mv.content=base+",minimum-scale=1";setTimeout(()=>{mv.content=base},50)},80)}};
 vv.addEventListener("resize",fix);vv.addEventListener("scroll",fix)})();
/* Kopfzeile: beim Rollen Titel einblenden (große Titel im Inhalt wie in iOS) */
addEventListener("scroll",()=>{const v=scrollY>40;if(v!==document.body.classList.contains("scrolled"))document.body.classList.toggle("scrolled",v)},{passive:true});
/* Tipp-Zeile im Tagebuch nur bei den ersten 5 Starts */
const TIPS=LS.get("tipps",0);LS.set("tipps",TIPS+1);
/* Neue App-Version automatisch laden: der Workflow „App veröffentlichen“ stempelt APPV und version.txt.
   Geprüft beim Start und bei jeder Rückkehr in die App; nie während ein Eingabefenster offen ist. */
const APPV="b38ca0c";
async function checkUpdate(){if(APPV.startsWith("__"))return;
 try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(!v||v===APPV||$("sheet").classList.contains("on"))return;
  if(LS.get("upd","")===v&&Date.now()-LS.get("updts",0)<6e5)return;  /* Schutz vor Endlosschleife, falls der CDN noch alt ausliefert */
  LS.set("upd",v);LS.set("updts",Date.now());location.replace("./?v="+v)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
checkUpdate();
/* Start: sofort mit dem letzten Stand anzeigen, dann im Hintergrund frisch laden */
if(CFG.token){render();loadAll()}else showSetup();
</script></body></html>
