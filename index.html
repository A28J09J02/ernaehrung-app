<style>

.seg{display:flex;background:var(--grid);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:14px}.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:12px 0}.nut div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px}.nut b{display:block;font-size:18px}.nut small{color:var(--mute);font-size:11px}
video{width:100%;border-radius:var(--rad);background:#000;aspect-ratio:3/4;object-fit:cover}

 opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast.on{opacity:1;transform:none}.toast button{border:0;background:none;color:var(--acc-bg);font-weight:700;pointer-events:auto;padding:4px 6px}

.cal button.o{background:var(--acc-bg);color:var(--acc)}.cal button.fut{opacity:.35}.cal button.t{outline:2px solid var(--acc);outline-offset:1px}

.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:12px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.wk{display:flex;align-items:flex-end;gap:4px;height:140px;margin:6px 0 4px;position:relative}.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.wk i{display:block;width:70%;border-radius:4px 4px 0 0}.wk em{position:absolute;left:8%;right:8%;height:2px;background:var(--ink);opacity:.5}
.wkl{display:flex;gap:4px}.wkl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.drow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--grid);font-size:14px;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.tg input{width:22px;height:22px;accent-color:var(--acc)}
.cmp{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
.foot{font-size:12px;color:var(--mute);margin:16px 2px}
/* Mein Tag */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.tile b{font-size:24px;font-weight:700;display:block;line-height:1.2}.tile b small{font-size:13px;font-weight:500;color:var(--mute)}.tile em{font-style:normal;font-size:12px}
.wkp{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}.wkp div{background:var(--grid);border-radius:10px;padding:6px 0}.wkp div.t{outline:2px solid var(--acc)}
.wkp b{display:block;font-size:18px;line-height:1.3}

/* Dashboard */
#dashf{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:var(--bg)}
.load{text-align:center;padding:60px 20px;color:var(--mute)}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div id="app"></div>
<div class="scrim" id="scrim"></div><nav class="drawer" id="drawer"></nav>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span></span><button hidden></button></div>
<script src="kern.js"></script>
<script>
"use strict";
/* ===== Speicher ===== */
const LS={get(k,d){try{const v=localStorage.getItem("ern_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem("ern_"+k,JSON.stringify(v));return true}catch(e){return false}}};
/* große Dinge (Lebensmitteldatenbank, Dashboard) im Cache-Speicher des Browsers statt localStorage */
const MEM={},KV={async get(k){if(k in MEM)return MEM[k];try{const c=await caches.open("ern-kv"),r=await c.match("/kv/"+encodeURIComponent(k));return r?(MEM[k]=await r.text()):null}catch(e){return null}},
 async set(k,v){MEM[k]=v;try{const c=await caches.open("ern-kv");await c.put("/kv/"+encodeURIComponent(k),new Response(v))}catch(e){}}};
let CFG=LS.get("cfg",{token:"",repo:"A28J09J02/garmin-dashboard",branch:"main"});
let C=LS.get("cache",{profil:null,lm:{items:[]},months:{},store:null,plan:null,anp:null,ts:0});
let Q=LS.get("queue",[]);
let BLS=null;
const saveC=()=>{if(!LS.set("cache",C))console.warn("Cache voll")},saveQ=()=>LS.set("queue",Q);
const $=id=>document.getElementById(id),h=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY=()=>EK.day(new Date());
let cur=TODAY(),view=LS.get("view","tag"),range=7,calM=TODAY().slice(0,7),lmTab="eigen",status="",busy=false;
if(!["tag","kal","verlauf","lm","profil","meintag","dash"].includes(view))view="tag";
const n0=v=>v==null||!isFinite(v)?"–":Math.round(v).toLocaleString("de-DE"),n1=v=>v==null||!isFinite(v)?"–":(Math.round(v*10)/10).toLocaleString("de-DE");
const WDS=["So","Mo","Di","Mi","Do","Fr","Sa"],wd=d=>WDS[new Date(d+"T12:00:00").getDay()],dm=d=>d.slice(8)+"."+d.slice(5,7)+".";
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const COL={g:"var(--g)",y:"var(--y)",r:"var(--r)",acc:"var(--acc)"};
function toast(t,ms=2600,act,fn){const e=$("toast"),b=e.querySelector("button");e.querySelector("span").textContent=t;
 b.hidden=!act;b.textContent=act||"";b.onclick=act?()=>{e.classList.remove("on");fn()}:null;
 e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}
const IC={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',apple:'<path d="M12 7c-2-2-7-2-7 4s3 9 5 9c1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-3 5-9s-5-6-7-4z"/><path d="M12 7c0-2 1-4 3-4"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
 sync:'<path d="M20 12a8 8 0 0 1-14 5M4 12a8 8 0 0 1 14-5"/><path d="M18 3v4h-4M6 21v-4h4"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ===== GitHub ===== */
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opt={},accept="application/vnd.github+json"){
 const r=await fetch("https://api.github.com/repos/"+CFG.repo+path,{cache:"no-store",...opt,
  headers:{Authorization:"Bearer "+CFG.token,Accept:accept,"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
 if(r.status===401){const e=new Error("Token ungültig oder abgelaufen");e.auth=1;throw e}
 return r}
async function getJson(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`);
 if(r.status===404)return{data:null,sha:null};if(!r.ok)throw new Error("GitHub "+r.status);
 const j=await r.json();return{data:j.content?JSON.parse(b64d(j.content)):null,sha:j.sha}}
async function getRaw(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`,{},"application/vnd.github.raw+json");
 if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
async function put(file,data,sha,msg){const r=await gh(`/contents/${file}`,{method:"PUT",body:JSON.stringify({message:msg,branch:CFG.branch,
  content:b64e(JSON.stringify(data,null,1)+"\n"),...(sha?{sha}:{})})});
 if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error("Speichern fehlgeschlagen ("+r.status+")");return true}

/* ===== Änderungen: lokal sofort, dann Warteschlange und hochladen ===== */
const P_PROF="data/ernaehrung/profil.json",P_LM="data/ernaehrung/lebensmittel.json",pMonth=d=>`data/ernaehrung/${d.slice(0,7)}.json`;
function apply(obj,op){
 if(op.t==="profil")return op.v;
 if(op.t==="food"||op.t==="fooddel"){const o=obj||{items:[]},it=(o.items||[]).filter(x=>x.id!==(op.t==="food"?op.item.id:op.id));
  if(op.t==="food")it.push(op.item);return{...o,items:it}}
 const o=obj||{},L=(o[op.d]||[]).filter(x=>x.id!==(op.e?op.e.id:op.id));
 if(op.t==="add"||op.t==="upd")L.push(op.e);
 o[op.d]=L;if(!L.length)delete o[op.d];return o}
function local(path,op){
 if(path===P_PROF)C.profil=apply(C.profil,op);
 else if(path===P_LM)C.lm=apply(C.lm,op);
 else{const m=path.slice(-12,-5);C.months[m]=apply(C.months[m]||{},op)}}
function setFile(path,v){if(path===P_PROF)C.profil=v;else if(path===P_LM)C.lm=v||{items:[]};else C.months[path.slice(-12,-5)]=v||{};
 for(const x of Q)if(x.path===path)local(path,x.op)}
function change(path,op,noRender){local(path,op);Q.push({path,op});saveC();saveQ();if(!noRender)render();flush()}
async function flush(){
 if(busy||!Q.length||!CFG.token)return;busy=true;setStatus();
 try{for(const path of [...new Set(Q.map(x=>x.path))]){const ops=Q.filter(x=>x.path===path);let ok=false;
   for(let i=0;i<4&&!ok;i++){const{data,sha}=await getJson(path);let v=data;for(const x of ops)v=apply(v,x.op);
    const n=ops.length,msg=path===P_PROF?"Ernährung: Profil (iPhone)":path===P_LM?"Ernährung: Lebensmittel (iPhone)":`Ernährung: ${n} Änderung${n>1?"en":""} (iPhone)`;
    ok=await put(path,v,sha,msg);if(ok){Q=Q.filter(x=>!ops.includes(x));saveQ();setFile(path,v)}}
   if(!ok)throw new Error("Konflikt beim Speichern")}
  saveC();if(status==="offline")status=""}

 return{d,e,s,t,m,p,has:e.length>0,done:d<TODAY(),gk:gd?gd.kcal:null,grade:e.length&&d<TODAY()?EK.dayGrade(s,t,m):null,kg:e.length&&d<TODAY()?EK.ampel("kcal",s.kcal,t.kcal):null}}

function streaks(){const T=TODAY(),has=d=>entries(d).length>0;let d=has(T)?T:EK.add(T,-1),n=0;while(has(d)){n++;d=EK.add(d,-1)}

let DASH={html:null,p:null,shown:null,url:null};
/* Blob-URL statt srcdoc: das Dashboard ändert location.hash – in einem srcdoc-Rahmen würde das die App selbst neu laden */
function setFrame(f,html){if(DASH.url)URL.revokeObjectURL(DASH.url);DASH.url=URL.createObjectURL(new Blob([html],{type:"text/html;charset=utf-8"}));f.src=DASH.url}
function vDash(){return`<div class="load" id="dl"><span class="spin">↻</span><br>Dashboard wird geladen …</div>`}
function showDash(){
 const top=document.querySelector(".top"),put=html=>{let f=$("dashf");if(!f){f=document.createElement("iframe");f.id="dashf";f.title="Dashboard";document.body.append(f)}
  f.style.top=top.getBoundingClientRect().bottom+"px";f.style.height=`calc(100% - ${top.getBoundingClientRect().bottom}px)`;
  if(DASH.shown!==html){setFrame(f,html);DASH.shown=html}const l=$("dl");if(l)l.style.display="none"};
 (async()=>{if(!DASH.html)DASH.html=await KV.get("dash_html");if(DASH.html&&view==="dash")put(DASH.html);
  const fresh=await buildDash();if(fresh&&view==="dash"){if(!DASH.shown)put(fresh);else if(fresh!==DASH.shown)toast("Dashboard aktualisiert",4000,"Anzeigen",()=>put(fresh))}
  else if(!fresh&&!DASH.html){const l=$("dl");if(l)l.innerHTML="Dashboard konnte nicht geladen werden (offline?)."}})()}
function hideDash(){const f=$("dashf");if(f){f.remove();DASH.shown=null}}
function buildDash(){if(!DASH.p)DASH.p=_buildDash().finally(()=>{DASH.p=null});return DASH.p}
async function _buildDash(){
 try{const tr=await gh(`/git/trees/${CFG.branch}?recursive=1`);if(!tr.ok)throw new Error("tree");
  const tree=(await tr.json()).tree.filter(x=>x.type==="blob"&&/^src\/(index\.html|favicon\.png|css\/.+\.css|js\/.+\.js|fonts\/.+\.woff2)$/.test(x.path));
  const get=async x=>{const k="blob:"+x.sha;let v=await KV.get(k);if(v==null){const r=await gh(`/git/blobs/${x.sha}`);if(!r.ok)throw new Error("blob");v=(await r.json()).content.replace(/\s/g,"");KV.set(k,v)}return v};
  const files={};await Promise.all(tree.map(async x=>files[x.path]=await get(x)));
  const txt=p=>b64d(files[p]),sorted=pre=>Object.keys(files).filter(p=>p.startsWith(pre)).sort();
  let st=JSON.parse(await KV.get("store_full")||"null"),pl=JSON.parse(await KV.get("plan_full")||"null");
  if(!st){st=await getRaw("data/store.json");KV.set("store_full",JSON.stringify(st))}
  if(!pl){pl=await getRaw("data/plan.json");if(pl)KV.set("plan_full",JSON.stringify(pl))}
  const tage={};for(const m of Object.keys(C.months).sort())Object.assign(tage,C.months[m]);
  const data={days:st.days,acts:Object.entries(st.acts).map(([k,v])=>({id:k,...v})),synced:st.synced,fitness:st.fitness??null,hrz:st.hrz??null,det:st.det??null,
   plan:pl,anp:C.anp,food:{profil:C.profil,tage}};
  let css=sorted("src/css/").map(p=>`/* ===== ${p.split("/").pop()} ===== */\n${txt(p)}`).join("\n");
  css=css.replace(/url\("(fonts\/[^"]+\.woff2)"\)/g,(m,f)=>files["src/"+f]?`url("data:font/woff2;base64,${files["src/"+f]}")`:m);
  const js=sorted("src/js/").map(p=>`/* ===== ${p.split("/").pop()} ===== */\n${txt(p)}`).join("\n").replace("__DATA__",()=>JSON.stringify(data).replace(/<\//g,"<\\/"));
  let html=txt("src/index.html").replace("__ICON__",files["src/favicon.png"]?"data:image/png;base64,"+files["src/favicon.png"]:"");
  html=html.replace("/*__CSS__*/",()=>css).replace("/*__JS__*/",()=>js);
  DASH.html=html;KV.set("dash_html",html);return html}

const per100=e=>{const o={};for(const[k]of EK.NUTR)o[k]=e.n&&e.n[k]!=null&&e.g?e.n[k]*100/e.g:null;return o};
function fromEntry(e){const f=foods().find(x=>x.src===e.src&&(x.name===e.name||e.name.startsWith(x.name+" (")));if(f)return f;
 return e.g?{id:e.src,name:e.name,src:e.src,n:per100(e),portion:{g:e.g,label:"wie zuletzt"}}:{id:e.src,name:e.name,src:e.src,n:{...e.n},portion:{g:100,label:"1 Portion"}}}
const BLS_F=["kcal","p","c","f","fib","sug","salt"];
function fromBls(r){const o={};BLS_F.forEach((k,i)=>o[k]=r[2+i]);return{id:"bls:"+r[0],name:r[1],src:"bls:"+r[0],n:o}}
function blsSearch(q){if(!BLS)return[];const w=EK.norm(q).split(/\s+/).filter(Boolean);if(!w.length)return[];
 /* BLS schreibt oft getrennt („Hafer Flocken“) – darum auch ohne Leerzeichen vergleichen */
 const qj=w.join(""),L=[];for(const r of BLS){const t=r[9],tc=t.replace(/ /g,"");if(w.every(x=>t.includes(x)||tc.includes(x))){const qs=w.join(" "),sc=(t===qs||t.startsWith(qs+" ")||(qj.length>=5&&tc.startsWith(qj))?0:tc.startsWith(qj)?1:t.startsWith(w[0])||tc.startsWith(w[0])?2:t.includes(" "+w[0])?3:4)*1000+t.length;L.push([sc,r])}}
 return L.sort((a,b)=>a[0]-b[0]).slice(0,40).map(x=>x[1])}

  if(mine.length)o+=`<div class="sec">Von dir & gespeichert</div>`+mine.slice(0,15).map(add).join("");
  const bl=blsSearch(q);
  o+=`<div class="sec">Grundnahrungsmittel (BLS)</div>`+(BLS?bl.length?bl.map(r=>add(fromBls(r))).join(""):`<p class="mute s">Nichts gefunden.</p>`:`<p class="mute s">Datenbank wird geladen …</p>`);
  o+=`<div class="sec">Markenprodukte (Open Food Facts)</div>`;
  o+=S.off&&S.offq===q?(S.off.length?S.off.map(add).join(""):`<p class="mute s">Nichts gefunden.</p>`):`<button class="btn w" data-off="1">In Open Food Facts suchen</button>`;
  o+=`<button class="btn w" style="margin-top:14px" data-newfood="1">„${h(q)}“ als eigenes Lebensmittel anlegen</button>`}
 el.innerHTML=o}
function offFood(p){const n=p.nutriments||{},k=n["energy-kcal_100g"]??(n.energy_100g!=null?n.energy_100g/4.184:null);
 if(k==null)return null;const sq=+p.serving_quantity;
 return{id:"off:"+p.code,name:p.product_name_de||p.product_name||"Produkt "+p.code,marke:(p.brands||"").split(",")[0].trim(),src:"off:"+p.code,
  n:{kcal:Math.round(k),p:n.proteins_100g??null,c:n.carbohydrates_100g??null,f:n.fat_100g??null,fib:n.fiber_100g??null,sug:n.sugars_100g??null,salt:n.salt_100g??null},
  portion:sq>0?{g:sq,label:p.serving_size||sq+" g"}:null}}
const OFF_F="code,product_name,product_name_de,brands,nutriments,serving_quantity,serving_size";
async function offSearch(){const q=S.q.trim();if(!q)return;const b=$("rl").querySelector("[data-off]");if(b)b.textContent="Suche …";
 try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&lc=de&fields=${OFF_F}`);
  const j=await r.json();S.off=(j.products||[]).map(offFood).filter(Boolean);S.offq=q}
 catch(e){S.off=[];S.offq=q;toast("Open Food Facts nicht erreichbar")}
 results()}
async function byBarcode(code){
 code=String(code).replace(/\D/g,"");if(code.length<8)return toast("Ungültiger Barcode");
 const own=foods().find(f=>f.src==="off:"+code||f.ean===code);if(own)return openAmount({food:own});
 toast("Suche Produkt …",1500);
 try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_F}`),j=await r.json();
  const f=j.status===1&&j.product?offFood({...j.product,code}):null;
  if(f){change(P_LM,{t:"food",item:{...f,fav:false}},true);return openAmount({food:f})}
  toast("Produkt unbekannt – leg es einmal selbst an, danach erkennt die App den Barcode",4500);openFoodForm(null,true);setEan(code)}
 catch(e){toast("Open Food Facts nicht erreichbar");openFoodForm(null,true);setEan(code)}}
function setEan(code){const f=$("ff");if(f){const i=document.createElement("input");i.type="hidden";i.name="ean";i.value=code;f.append(i)}}

let SCAN=null;
async function openScan(){const sh=$("sheet");sh.classList.add("on");
 sh.innerHTML=`<div class="top"><button class="ib" data-back="1" aria-label="Zurück">‹</button><h1>Barcode</h1><span style="min-width:42px"></span></div><main>
 <video id="vid" playsinline muted autoplay></video><p class="s mute" id="sc-msg">Kamera wird gestartet …</p>
 <label class="f">Oder Nummer eintippen</label><div class="row"><input id="ean" class="inp" inputmode="numeric" placeholder="4001234567890"><button class="btn p" data-ean="1" style="flex:0 0 auto">Suchen</button></div></main>`;
 const msg=t=>{const e=$("sc-msg");if(e)e.textContent=t},done=c=>{stopScan();byBarcode(c)};
 try{const v=$("vid");
  if("BarcodeDetector" in window){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=st;await v.play();
   const bd=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});SCAN={st,on:true};msg("Barcode ins Bild halten");
   const loop=async()=>{if(!SCAN||!SCAN.on)return;try{const r=await bd.detect(v);if(r.length)return done(r[0].rawValue)}catch(e){}requestAnimationFrame(loop)};loop()}
  else{if(!window.ZXing)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";s.onload=ok;s.onerror=no;document.head.append(s)});
   const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
   const rd=new ZXing.BrowserMultiFormatReader(hints);SCAN={rd,on:true};msg("Barcode ins Bild halten");
   await rd.decodeFromConstraints({video:{facingMode:"environment"}},v,(r)=>{if(r&&SCAN&&SCAN.on)done(r.getText())})}}
 catch(e){msg("Kamera nicht verfügbar ("+(e&&e.name||"Fehler")+"). Du kannst die Nummer unten eintippen.")}}
function stopScan(){if(!SCAN)return;SCAN.on=false;try{SCAN.st&&SCAN.st.getTracks().forEach(t=>t.stop())}catch(e){}try{SCAN.rd&&SCAN.rd.reset()}catch(e){}SCAN=null}

let A=null;
function openAmount({food,entry}){
 A={food:food||fromEntry(entry),entry,meal:entry?entry.meal:S.meal,g:entry?(entry.g??100):food.portion?food.portion.g:100};
 const sh=$("sheet");sh.classList.add("on");const f=A.food,isFav=foods().some(x=>x.id===f.id&&x.fav);
 const srcL=isOwn(f)?"von dir angelegt":String(f.src).startsWith("bls")?"Bundeslebensmittelschlüssel":String(f.src).startsWith("off")?"Open Food Facts":"";
 sh.innerHTML=`<div class="top"><button class="ib" data-back="${entry?"close":"1"}" aria-label="Zurück">‹</button><h1>${entry?"Eintrag ändern":"Menge"}</h1><button class="ib" data-fav="1" aria-label="Favorit">${isFav?"★":"☆"}</button></div><main>
 <div class="card"><b style="font-size:18px">${h(f.name)}</b>${f.marke?`<div class="mute s">${h(f.marke)}</div>`:""}<div class="mute s">${n0(f.n.kcal)} kcal je 100 g${srcL?" · "+srcL:""}</div></div>
 <label class="f">Menge in Gramm</label><input id="gr" class="inp" type="text" inputmode="decimal" value="${A.g}">
 <div class="qs">${[...(f.portion&&f.portion.g!==100?[[f.portion.g,(f.portion.label||"1 Portion")+(String(f.portion.label||"").includes(" g")?"":" ("+n0(f.portion.g)+" g)")]]:[]),[50,"50 g"],[100,"100 g"],[150,"150 g"],[200,"200 g"],[250,"250 g"]].map(([g,l])=>`<button data-g="${g}">${h(l)}</button>`).join("")}</div>
 <div class="nut" id="nut"></div>
 <label class="f">Mahlzeit</label><div class="seg">${EK.MEALS.map(([k,l])=>`<button data-meal="${k}" class="${A.meal===k?"on":""}">${l.replace("essen","")}</button>`).join("")}</div>
 <button class="btn p w" style="margin-top:16px" data-save="1">${entry?"Speichern":"Hinzufügen"}</button>
 ${entry?`<button class="btn d w" style="margin-top:8px" data-delent="${h(entry.id)}">Eintrag löschen</button>`:""}</main>`;
 nut()}
function nut(){const g=+String($("gr").value).replace(",",".")||0;A.g=g;const n=EK.scale(A.food.n,g);
 $("nut").innerHTML=[["kcal","kcal"],["p","Protein"],["c","KH"],["f","Fett"]].map(([k,l])=>`<div><b>${k==="kcal"?n0(n[k]):n1(n[k])}</b><small>${l}${k==="kcal"?"":" g"}</small></div>`).join("")}
function saveAmount(){
 if(!(A.g>0))return toast("Bitte eine Menge eingeben");
 const f=A.food,e={id:A.entry?A.entry.id:EK.uid(),meal:A.meal,name:A.entry?A.entry.name:f.name+(f.marke?" ("+f.marke+")":""),src:f.src,g:A.g,n:EK.scale(f.n,A.g),ts:Date.now()};
 change(pMonth(cur),{t:A.entry?"upd":"add",d:cur,e});closeSheet();toast(`${n0(e.n.kcal)} kcal eingetragen`)}
function toggleFav(){const f=A.food,ex=foods().find(x=>x.id===f.id),fav=!(ex&&ex.fav);
 change(P_LM,{t:"food",item:{...(ex||f),fav}},true);const b=document.querySelector("[data-fav]");if(b)b.textContent=fav?"★":"☆";toast(fav?"Als Favorit gespeichert":"Favorit entfernt")}
/* Schnell eintragen: nur Name + kcal (+ Makros) für eine Portion */
function openManual(){const sh=$("sheet");sh.classList.add("on");
 const fl=(k,l,ph)=>`<div><label class="f">${l}</label><input class="inp" name="${k}" type="text" inputmode="decimal" placeholder="${ph||""}"></div>`;
 sh.innerHTML=`<div class="top"><button class="ib" data-back="1" aria-label="Zurück">‹</button><h1>Schnell eintragen</h1><span style="min-width:42px"></span></div><main><form id="mf">
 <label class="f">Name</label><input class="inp" name="name" required placeholder="z. B. Döner">
 <div class="row">${fl("kcal","Kalorien","kcal")}${fl("g","Menge (g)","optional")}</div>
 <div class="row">${fl("p","Protein g")}${fl("c","KH g")}${fl("f","Fett g")}</div>
 <p class="s mute">Werte für die ganze Portion bzw. die angegebene Menge.</p>
 <div class="tg"><span>Als eigenes Lebensmittel speichern</span><input type="checkbox" name="keep" checked></div>
 <button class="btn p w" style="margin-top:12px" type="submit">Eintragen</button></form></main>`}
function saveManual(f){const v=k=>{const s=f.elements[k].value.trim().replace(",",".");return s===""?null:+s};
 const name=f.elements.name.value.trim(),kc=v("kcal");if(!name||kc==null)return toast("Name und Kalorien angeben");
 const amount=v("g"),n={kcal:Math.round(kc),p:v("p"),c:v("c"),f:v("f"),fib:null,sug:null,salt:null},src="eigen:"+EK.uid();
 if(f.elements.keep.checked){const base=amount||100,n100={};for(const k in n)n100[k]=n[k]==null?null:EK.r(n[k]*100/base,1);
  change(P_LM,{t:"food",item:{id:src,src,own:true,name,n:n100,portion:amount?{g:amount,label:amount+" g"}:{g:100,label:"1 Portion"},fav:false}},true)}
 change(pMonth(cur),{t:"add",d:cur,e:{id:EK.uid(),meal:S.meal,name,src,g:amount,n,ts:Date.now()}});closeSheet();toast(`${n0(n.kcal)} kcal eingetragen`)}
function closeSheet(){stopScan();const sh=$("sheet");sh.classList.remove("on");sh.innerHTML="";A=null}

/* ===== Wischen zum Löschen ===== */
let SW=null;const OPEN=-92;
function resetSwipes(except){document.querySelectorAll(".swc").forEach(x=>{if(x!==except){x.style.transform="";x.dataset.open=""}})}
document.addEventListener("touchstart",ev=>{const c=ev.target.closest(".swc");if(!c)return resetSwipes();resetSwipes(c);
 SW={c,x:ev.touches[0].clientX,y:ev.touches[0].clientY,base:c.dataset.open?OPEN:0,dx:0,lock:null}},{passive:true});
document.addEventListener("touchmove",ev=>{if(!SW)return;const dx=ev.touches[0].clientX-SW.x,dy=ev.touches[0].clientY-SW.y;
 if(SW.lock==null&&(Math.abs(dx)>8||Math.abs(dy)>8))SW.lock=Math.abs(dx)>Math.abs(dy)?"x":"y";
 if(SW.lock!=="x")return;SW.dx=dx;SW.c.classList.add("drag");SW.c.style.transform=`translateX(${Math.min(0,SW.base+dx)}px)`},{passive:true});
document.addEventListener("touchend",()=>{if(!SW)return;const c=SW.c,pos=Math.min(0,SW.base+SW.dx);c.classList.remove("drag");
 if(SW.lock==="x"){SW.moved=true;if(pos<-c.offsetWidth*.55){c.style.transform=`translateX(-100%)`;const b=c.parentNode.querySelector(".bg button");setTimeout(()=>b&&b.click(),180)}
  else if(pos<OPEN/2){c.style.transform=`translateX(${OPEN}px)`;c.dataset.open="1"}else{c.style.transform="";c.dataset.open=""}
  c.dataset.swiped=Date.now()}
 SW=null});

/* ===== Garmin-Sync anstoßen ===== */
async function syncGarmin(){closeDrawer();
 try{const r=await gh("/actions/workflows/garmin-sync.yml/dispatches",{method:"POST",body:JSON.stringify({ref:CFG.branch})});
  if(r.status===403)return toast("Token darf keine Actions starten – Berechtigung „Actions: Read and write“ ergänzen",4500);
  if(!r.ok)return toast("Sync konnte nicht gestartet werden ("+r.status+")");
  toast("Garmin-Sync gestartet – neue Werte in 1–2 Minuten",3500);
  const before=C.store&&C.store.synced;let n=0;
  const poll=async()=>{if(++n>8)return;try{const st=await getRaw("data/store.json");if(st&&st.synced!==before){await loadAll();if(view==="dash")showDash();return toast("Garmin-Daten aktualisiert")}}catch(e){}setTimeout(poll,30000)};
  setTimeout(poll,60000)}
 catch(e){toast(e.auth?e.message:"Keine Verbindung")}}

/* ===== Einrichtung ===== */
function showSetup(err){
 $("app").innerHTML=`<div class="top"><span style="min-width:42px"></span><h1>Einrichten</h1><span style="min-width:42px"></span></div><main>
 <div class="card"><p style="margin-top:0">Die App speichert dein Ernährungstagebuch in deinem GitHub-Repo – dort holt es sich auch das Dashboard. Dafür braucht sie einmalig einen GitHub-Token.</p>
 ${err?`<p style="color:var(--r)">${h(err)}</p>`:""}
 <form id="sf"><label class="f">Repository</label><input class="inp" name="repo" value="${h(CFG.repo)}" autocapitalize="off" autocorrect="off">
 <label class="f">GitHub-Token (fine-grained, beginnt mit github_pat_)</label><input class="inp" name="token" type="password" value="" placeholder="github_pat_…" autocapitalize="off" autocorrect="off">
 <button class="btn p w" style="margin-top:14px" type="submit">Verbinden</button></form>
 <p class="s mute">Der Token bleibt nur auf diesem iPhone gespeichert. Rechte, nur für dieses eine Repository: Contents „Read and write“, Actions „Read and write“.</p></div></main>`}
async function setup(f){const repo=f.elements.repo.value.trim(),token=f.elements.token.value.trim();if(!repo||!token)return toast("Repo und Token angeben");
 CFG={...CFG,repo,token};
 try{const r=await gh("");if(r.status===404){CFG.token="";return showSetup("Repo nicht gefunden – Name prüfen oder dem Token Zugriff auf dieses Repo geben.")}
  const j=await r.json();if(j.permissions&&!j.permissions.push){CFG.token="";return showSetup("Der Token darf nicht schreiben – Contents „Read and write“ setzen.")}
  CFG.branch=j.default_branch||"main";LS.set("cfg",CFG);toast("Verbunden");render();loadAll()}
 catch(e){CFG.token="";showSetup(e.message||"Keine Verbindung")}}

/* ===== Ereignisse ===== */
document.addEventListener("click",ev=>{const t=ev.target,b=s=>t.closest(s);let x;
 const sw=b(".swc");if(sw&&(sw.dataset.open||Date.now()-(+sw.dataset.swiped||0)<350)){if(sw.dataset.open&&Date.now()-(+sw.dataset.swiped||0)>350){sw.style.transform="";sw.dataset.open=""}return}
 if(b("[data-menu]"))openDrawer();
 else if(t===$("scrim"))closeDrawer();
 else if(x=b("[data-go]")){if(x.dataset.go!=="dash")hideDash();go(x.dataset.go)}
 else if(x=b("[data-day]")){const v=+x.dataset.day;cur=v===0?TODAY():EK.add(cur,v);if(cur>TODAY())cur=TODAY();render()}
 else if(x=b("[data-open]")){cur=x.dataset.open;go("tag")}
 else if(x=b("[data-cal]")){calM=x.dataset.cal;render()}
 else if(x=b("[data-range]")){range=+x.dataset.range;render()}
 else if(x=b("[data-lmtab]")){lmTab=x.dataset.lmtab;render()}
 else if(x=b("[data-add]"))openAdd(x.dataset.add);
 else if(x=b("[data-ent]")){const e=entries(cur).find(y=>y.id===x.dataset.ent);if(e)openAmount({entry:e})}
 else if(x=b("[data-delent]")){const id=x.dataset.delent;if($("sheet").classList.contains("on"))closeSheet();delEntry(id)}
 else if(x=b("[data-editfood]")){const f=foods().find(y=>y.id===x.dataset.editfood);if(f)openFoodForm(f)}
 else if(x=b("[data-delfood]")){const id=x.dataset.delfood;if($("sheet").classList.contains("on"))closeSheet();delFood(id)}
 else if(b("[data-newfood]")){const fromAdd=view!=="lm"||$("sheet").classList.contains("on"),q=fromAdd?S.q:"";openFoodForm(null,fromAdd);if(q&&$("ff"))$("ff").elements.name.value=q}
 else if(b("[data-close]"))closeSheet();
 else if(x=b("[data-back]")){stopScan();if(x.dataset.back==="close")closeSheet();else sheetAdd()}
 else if(x=b("[data-pick]"))openAmount({food:PICK[+x.dataset.pick]});
 else if(b("[data-off]"))offSearch();
 else if(b("[data-scan]"))openScan();
 else if(b("[data-ean]"))byBarcode($("ean").value);
 else if(b("[data-manual]"))openManual();
 else if(x=b("[data-g]")){$("gr").value=x.dataset.g;nut()}
 else if(x=b("[data-meal]")){A.meal=x.dataset.meal;document.querySelectorAll("[data-meal]").forEach(y=>y.classList.toggle("on",y===x))}
 else if(b("[data-save]"))saveAmount();
 else if(b("[data-fav]"))toggleFav();
 else if(b("[data-sync]"))syncGarmin();
 else if(b("[data-dashre]")){toast("Dashboard wird neu geladen …");DASH.shown=null;buildDash().then(h=>{if(h&&view==="dash"){const f=$("dashf");if(f){setFrame(f,h);DASH.shown=h}}})}
 else if(b("[data-reload]"))loadAll();
 else if(b("[data-blsload]"))loadBls(true);
 else if(b("[data-logout]")){if(confirm("Token von diesem iPhone entfernen?")){CFG.token="";LS.set("cfg",CFG);showSetup()}}});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){S.q=ev.target.value;clearTimeout(results.t);results.t=setTimeout(results,120)}else if(ev.target.id==="gr")nut()});
document.addEventListener("change",ev=>{if(ev.target.name==="fixon"&&ev.target.form&&ev.target.form.id==="pf")saveProfil(ev.target.form)});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;
 if(f.id==="pf")saveProfil(f);else if(f.id==="mf")saveManual(f);else if(f.id==="sf")setup(f);
 else if(f.id==="ff")saveFoodForm(f)});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="ean")byBarcode(ev.target.value)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;
 if(cur<TODAY()&&!$("sheet").classList.contains("on")&&Date.now()-C.ts>6*36e5)cur=TODAY();
 if(Date.now()-C.ts>60000){loadAll().then(()=>{if(view==="dash")showDash()})}else flush()});
addEventListener("online",flush);
addEventListener("resize",()=>{const f=$("dashf"),t=document.querySelector(".top");if(f&&t){f.style.top=t.getBoundingClientRect().bottom+"px";f.style.height=`calc(100% - ${t.getBoundingClientRect().bottom}px)`}});

/* Start: sofort mit dem letzten Stand anzeigen, dann im Hintergrund frisch laden */
if(CFG.token){render();loadAll()}else showSetup();
</script></body></html>
