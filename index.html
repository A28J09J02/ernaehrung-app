const b64e=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opt={},accept="application/vnd.github+json"){
 const r=await fetch("https://api.github.com/repos/"+CFG.repo+path,{cache:"no-store",...opt,
  headers:{Authorization:"Bearer "+CFG.token,Accept:accept,"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
 if(r.status===401){const e=new Error("Token ungültig oder abgelaufen");e.auth=1;throw e}
 return r}
async function getJson(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`);
 if(r.status===404)return{data:null,sha:null};if(!r.ok)throw new Error("GitHub "+r.status);
 const j=await r.json();return{data:j.content?JSON.parse(b64d(j.content)):null,sha:j.sha}}
async function getRaw(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`,{},"application/vnd.github.raw+json");
 if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
async function put(file,data,sha,msg){const r=await gh(`/contents/${file}`,{method:"PUT",body:JSON.stringify({message:msg,branch:CFG.branch,
  content:b64e(JSON.stringify(data,null,1)+"\n"),...(sha?{sha}:{})})});
 if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error("Speichern fehlgeschlagen ("+r.status+")");return true}

 if(op.t==="profil")return op.v;

  if(op.t==="food")it.push(op.item);return{...o,items:it}}
 const o=obj||{},L=(o[op.d]||[]).filter(x=>x.id!==(op.e?op.e.id:op.id));
 if(op.t==="add"||op.t==="upd")L.push(op.e);
 o[op.d]=L;if(!L.length)delete o[op.d];return o}

async function flush(){
 if(busy||!Q.length||!CFG.token)return;busy=true;setStatus();
 try{for(const path of [...new Set(Q.map(x=>x.path))]){const ops=Q.filter(x=>x.path===path);let ok=false;
   for(let i=0;i<4&&!ok;i++){const{data,sha}=await getJson(path);let v=data;for(const x of ops)v=apply(v,x.op);
    const n=ops.length,msg=path===P_PROF?"Ernährung: Profil (iPhone)":path===P_LM?"Ernährung: Lebensmittel (iPhone)":`Ernährung: ${n} Änderung${n>1?"en":""} (iPhone)`;
    ok=await put(path,v,sha,msg);if(ok){Q=Q.filter(x=>!ops.includes(x));saveQ();setFile(path,v)}}
   if(!ok)throw new Error("Konflikt beim Speichern")}
  saveC();if(status==="offline")status=""}

 for(let k=-45;k<=14;k++){const d=EK.add(TODAY(),k),e=entries(d);L.push({d,has:e.length>0,eaten:EK.sum(e).kcal,target:EK.target(p,g,d).kcal,w:EK.weight(planDay(d))})}

 if(ch&&ch.state==="full"){kg="g";if(grade!=="g")grade=EK.ampel("p",s.p,m.p)==="r"?"y":"g"}

/* Cheat Day: Überschuss und wohin er verteilt wurde */

  c.state==="run"?`<b>${n0(c.need)} kcal über dem Ziel</b> – kein Problem: automatisch verteilt auf ${list}. Halte dort dein (etwas niedrigeres) Ziel, dann ist der Tag wieder grün.`:
  `<b>${n0(c.need)} kcal über dem Ziel</b> – verteilt auf ${list||"–"}${c.left?`; ${n0(c.left)} kcal ließen sich nicht mehr unterbringen`:""}. Ein Ausgleichstag ohne Einträge zählt nicht.`;
 return`<div class="hint acc">↺<span>${st}</span></div>`}
/* Ausgleichstag: warum das Ziel niedriger ist und wie es leichter geht */

/* Woche Mo–So: Bilanz gegessen gegen Garmin-Verbrauch und gegen das Wochenziel */
function weekCard(){const T=TODAY(),mon=EK.monday(T),p=prof(),rate=p.rate!=null?+p.rate:null;
 let bal=0,n=0,plan=0;for(let k=0;k<7;k++){const d=EK.add(mon,k);if(d>=T)break;const i=info(d);if(!i.has)continue;n++;
  const use=i.gk!=null?i.gk:i.t.orig-EK.goalAdj(p);bal+=i.s.kcal-use;plan+=EK.goalAdj(p)}
 if(!n)return"";const kg=bal/7700,okc=bal<=plan+200;
 return`<div class="card"><h2>Diese Woche <small>${n} Tag${n>1?"e":""} erfasst</small></h2><div class="wt">
 <div><span>Bilanz</span><b class="${bal>0&&rate!=null&&rate<0?"warn":""}">${bal>0?"+":"−"}${n0(Math.abs(bal))}</b> <small class="mute">kcal</small></div>
 <div><span>≈ Körpergewicht</span><b>${kg>0?"+":"−"}${n1(Math.abs(kg))}</b> <small class="mute">kg</small></div>
 <div><span>Plan bisher</span><b>${plan>0?"+":plan<0?"−":""}${n0(Math.abs(plan))}</b> <small class="mute">kcal</small></div></div>
 <p class="s ${okc?"mute":"warn"} centernote">${okc?"Du liegst im Plan.":"Noch über dem Plan – der Ausgleich der nächsten Tage holt das auf."} Bilanz = gegessen − Garmin-Verbrauch.</p></div>`}
/* Verbrannt laut Garmin – Aktivkalorien hervorgehoben */
/* So entsteht das Tagesziel: Grundziel (inkl. Ausgleich) + Aktivkalorien = Ziel heute */
function burnRow(i){const t=i.t;if(i.d>TODAY())return"";const grund=t.kcal-t.train,bonusL=t.bonusAll?"aktiv verbrannt":"Training";
 const sy=C.store&&C.store.synced?new Date(C.store.synced*1000):null,isT=i.d===TODAY(),
  /* Der letzte Sync stammt von einem früheren Tag: für heute gibt es noch keine Garmin-Werte – nicht „0 · Stand 22:52“ zeigen */
  noData=isT&&sy&&EK.day(sy)!==i.d,
  syn=isT&&sy?(noData?"noch keine Werte von heute<br>letzter Sync "+sy.toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"}):"Stand "+sy.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})):"";
 return`<div class="burn"><div><b>${n0(grund)}</b><span>Grundziel${t.aus?`<br>inkl. −${n0(t.aus)} Ausgleich`:""}</span></div>
 <div class="fire${noData?" na":""}"><b>+ 🔥 ${noData?"–":n0(t.train)}</b><span>${noData?"":bonusL}${syn?`${noData?"":"<br>"}${syn}`:""}</span></div>
 <div><b>= ${n0(t.kcal)}</b><span>dein Ziel ${isT?(noData?"(vorläufig)":"heute"):""}</span></div></div>`}
/* Gewicht: Wochen bis zum Ziel – nach Plan-Tempo und nach deinem echten Schnitt der letzten 14 Tage */
function weightCard(){const p=prof(),w=GW(),goal=C.profil&&C.profil.zielGewicht;if(!w&&!goal)return"";
 let est="";if(goal&&w&&Math.abs(w-goal)>=0.2){const need=w-goal,dir=need>0?-1:1,fmtW=x=>x>52?"über ein Jahr":`ca. ${Math.ceil(x)} Woche${Math.ceil(x)>1?"n":""} (bis ${new Date(Date.now()+x*7*864e5).toLocaleDateString("de-DE",{day:"numeric",month:"short"})})`;
  const lines=[];if(p.rate&&Math.sign(p.rate)===dir)lines.push(`Nach Plan (${String(Math.abs(p.rate)).replace(".",",")} kg/Woche): <b>${fmtW(Math.abs(need/p.rate))}</b>`);
  let b=0,n=0;for(let k=1;k<=14;k++){const i=info(EK.add(TODAY(),-k));if(i.has&&i.gk!=null){b+=i.s.kcal-i.gk;n++}}
  if(n>=5){const kgw=b/n*7/7700;lines.push(Math.sign(kgw)===dir&&Math.abs(kgw)>0.02?`Nach deinem echten Schnitt (${b/n>0?"+":"−"}${n0(Math.abs(b/n))} kcal/Tag, ${n} Tage): <b>${fmtW(Math.abs(need/kgw))}</b>`:`Nach deinem echten Schnitt der letzten ${n} Tage geht es gerade nicht Richtung Ziel.`)}
  else lines.push(`Echter Schnitt: ab 5 erfassten Tagen mit Garmin-Werten.`);
  est=`<div class="s west">${lines.map(x=>`<div>⏱ ${x}</div>`).join("")}</div>`}
 return`<div class="card"><div class="wt"><div><span>Aktuell</span><b>${w?n1(w):"–"}</b> <small class="mute">kg</small></div><div><span>Ziel</span><b>${goal?n1(goal):"–"}</b> <small class="mute">kg</small></div>
 <div><span>${goal&&w?(w>goal?"noch abnehmen":w<goal?"noch zunehmen":"erreicht"):"Zielgewicht"}</span><b>${goal&&w?n1(Math.abs(w-goal)):`<button class="btn sm" data-go="profil">eintragen</button>`}</b>${goal&&w?' <small class="mute">kg</small>':""}</div></div>${est}</div>`}
function actsRow(d){if(!C.store||d>TODAY())return"";const gd=C.store.days[d]||{},A=C.store.acts.filter(a=>a.date===d);if(!A.length&&gd.steps==null)return"";
 return`<div class="sec">Aktivitäten</div><div class="alist">${gd.steps!=null?`<div><i>👟</i><span><b>${n0(gd.steps)}</b> Schritte</span></div>`:""}

const UF={"µg>mg":1e-3,"mg>µg":1e3,"mg>g":1e-3,"g>mg":1e3};
function fromBls(r){const o={};BLSM.felder.forEach((k,i)=>{if(k==="water")return;let v=r[2+i];const mu=(EK.MICRO.find(m=>m[0]===k)||[])[2],bu=BLSM.einheiten[k];
  if(v!=null&&mu&&bu&&mu!==bu&&UF[bu+">"+mu])v=v*UF[bu+">"+mu];o[k]=v});return{id:"bls:"+r[0],name:r[1],src:"bls:"+r[0],n:o}}
function blsSearch(q){if(!BLS)return[];const w=EK.norm(q).split(/\s+/).filter(Boolean);if(!w.length)return[];
 /* BLS schreibt oft getrennt („Hafer Flocken“) – darum auch ohne Leerzeichen vergleichen */
 const ni=2+BLSM.felder.length,qj=w.join(""),L=[];for(const r of BLS){const t=r[ni],tc=t.replace(/ /g,"");if(w.every(x=>t.includes(x)||tc.includes(x))){const qs=w.join(" "),sc=(t===qs||t.startsWith(qs+" ")||(qj.length>=5&&tc.startsWith(qj))?0:tc.startsWith(qj)?1:t.startsWith(w[0])||tc.startsWith(w[0])?2:t.includes(" "+w[0])?3:4)*1000+t.length;L.push([sc,r])}}

/* ===== Garmin-Sync anstoßen ===== */
/* Automatisch beim Öffnen: Garmin-Stand älter als 2 h → Cloud-Sync anstoßen (geplante GitHub-Läufe kommen oft Stunden zu spät).
   Höchstens 1× pro Stunde, nie während ein Sync läuft. */
function autoSync(){const sy=C.store&&C.store.synced;if(!sy||!CFG.token||Date.now()/1000-sy<2*3600||syncSince())return;
 if(Date.now()-LS.get("autosync",0)<36e5)return;LS.set("autosync",Date.now());syncGarmin(true)}
/* Sperre gegen Doppeltipp: Zeitpunkt des Starts in localStorage (max. 5 Min.), vor dem Start Prüfung auf einen schon laufenden Lauf */
const SYNC_LOCK=5*60e3,syncSince=()=>{const t=LS.get("sync",0);return t&&Date.now()-t<SYNC_LOCK?t:0},hhmm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
async function syncGarmin(auto){closeDrawer();
 const since=syncSince();if(since)return auto?null:toast(`Sync läuft bereits (seit ${hhmm(since)}) – neue Werte in Kürze`,3500);
 LS.set("sync",Date.now());
 const unlock=()=>LS.set("sync",0);
 try{let active=false;
  try{const r=await gh("/actions/workflows/garmin-sync.yml/runs?per_page=5");if(r.ok){const j=await r.json();active=(j.workflow_runs||[]).some(x=>x.status==="queued"||x.status==="in_progress"||x.status==="waiting")}}catch(e){if(e.auth)throw e}
  if(active){if(!auto)toast("Sync läuft bereits – neue Werte in Kürze",3500)}
  else{const r=await gh("/actions/workflows/garmin-sync.yml/dispatches",{method:"POST",body:JSON.stringify({ref:CFG.branch})});
   if(r.status===403){unlock();return toast("Token darf keine Actions starten – Berechtigung „Actions: Read and write“ ergänzen",4500)}
   if(!r.ok){unlock();return toast("Sync konnte nicht gestartet werden ("+r.status+")")}
   toast(auto?"Garmin-Daten sind älter als 2 h – hole aktuelle Werte (1–2 Min.)":"Garmin-Sync gestartet – neue Werte in 1–2 Minuten",3500)}
  setStatus();
  const before=C.store&&C.store.synced;let n=0;
  const poll=async()=>{if(++n>8){unlock();return setStatus()}try{const st=await getRaw("data/store.json");if(st&&st.synced!==before){unlock();await loadAll();if(view==="dash")showDash();return toast("Garmin-Daten aktualisiert")}}catch(e){}setTimeout(poll,30000)};
  setTimeout(poll,60000)}
 catch(e){unlock();toast(e.auth?e.message:"Keine Verbindung")}}

 else if(b("[data-newfood]")){const fromAdd=view!=="lm"||$("sheet").classList.contains("on"),q=fromAdd?S.q:"";openFoodForm(null,fromAdd);if(q&&$("ff"))$("ff").elements.name.value=q}
 else if(b("[data-close]")){if(S.mode==="recipe"&&R&&!b("[data-rclose]")){stopScan();renderRecipe()}else{closeSheet();R=null;S.mode="log"}}
 else if(b("[data-recipe]"))openRecipe("cook");
 else if(b("[data-newdish]"))openRecipe("save");
 else if(x=b("[data-dishadd]")){ev.stopPropagation();logDish(x.dataset.dishadd)}
 else if(x=b("[data-dish]"))openDish(x.dataset.dish);
 else if(x=b("[data-dmeal]")){DSH.meal=x.dataset.dmeal;renderDish()}
 else if(x=b("[data-dn]")){DSH.n=Math.max(1,Math.min(20,DSH.n+(+x.dataset.dn)));renderDish()}
 else if(b("[data-dishlog]")){const id=DSH.id,m=DSH.meal;closeSheet();logDish(id,m)}
 else if(b("[data-dishcook]")){const f=foods().find(y=>y.id===DSH.id);if(f)dishToRecipe(f,"cook")}
 else if(b("[data-dishedit]")){const f=foods().find(y=>y.id===DSH.id);if(f)dishToRecipe(f,"save")}
 else if(b("[data-dishdel]")){const id=DSH.id;if(confirm("Gericht löschen?")){closeSheet();delFood(id)}}
 else if(b("[data-micro]"))openMicro(cur);
 else if(b("[data-wizard]"))openWizard();
 else if(x=b("[data-wrate]")){W.ziel=($("wziel")||{}).value??W.ziel;W.rate=+x.dataset.wrate;renderWizard()}
 else if(b("[data-wapply]")){W.ziel=($("wziel")||{}).value??W.ziel;applyWizard()}
 else if(b("[data-raddz]")){S={...S,mode:"recipe",q:"",off:null,offq:""};sheetAdd();setTimeout(()=>{const i=$("q");i&&i.focus()},80)}
 else if(x=b("[data-rdel]")){R.items.splice(+x.dataset.rdel,1);renderRecipe()}
 else if(x=b("[data-rn]")){R.portions=Math.max(1,Math.min(14,R.portions+(+x.dataset.rn)));renderRecipe()}
 else if(x=b("[data-rmeal]")){R.meal=x.dataset.rmeal;renderRecipe()}
 else if(b("[data-rsave]"))saveRecipe();
 else if(x=b("[data-back]")){stopScan();if(x.dataset.back==="close")closeSheet();else sheetAdd()}
 else if(x=b("[data-pick]"))openAmount({food:PICK[+x.dataset.pick]});
 else if(b("[data-off]"))offSearch();
 else if(b("[data-scan]"))openScan();
 else if(b("[data-ean]"))byBarcode($("ean").value);
 else if(b("[data-manual]"))openManual();
 else if(x=b("[data-unit]"))setUnit(x.dataset.unit);
 else if(b("[data-umore]")){readQ();A.more=true;renderAmount()}
 else if(x=b("[data-qd]")){readQ();const st=A.u.k==="g"?10:A.u.k==="pack"?.25:A.u.k==="smart"&&A.q<=1&&+x.dataset.qd<0?.5:1;setQ(Math.max(st>=1?1:st,A.q+(+x.dataset.qd)*st))}
 else if(x=b("[data-qset]"))setQ(+x.dataset.qset);
 else if(x=b("[data-meal]")){A.meal=x.dataset.meal;document.querySelectorAll("[data-meal]").forEach(y=>y.classList.toggle("on",y===x))}
 else if(b("[data-save]"))saveAmount();
 else if(b("[data-fav]"))toggleFav();
 else if(b("[data-sync]"))syncGarmin();
 else if(b("[data-dashre]")){toast("Dashboard wird neu geladen …");DASH.shown=null;buildDash().then(h=>{if(h&&view==="dash"){const f=$("dashf");if(f){setFrame(f,h);DASH.shown=h}}})}
 else if(b("[data-reload]"))loadAll();
 else if(b("[data-blsload]"))loadBls(true);
 else if(b("[data-logout]")){if(confirm("Token von diesem iPhone entfernen?")){CFG.token="";LS.set("cfg",CFG);showSetup()}}});
document.addEventListener("input",ev=>{if(ev.target.id==="ranl"&&R)R.anleitung=ev.target.value;else if(ev.target.id==="wziel"&&W)W.ziel=ev.target.value;else if(ev.target.id==="rname"&&R)R.name=ev.target.value;else if(ev.target.id==="q"){S.q=ev.target.value;clearTimeout(results.t);results.t=setTimeout(results,120)}else if(ev.target.id==="qv"){readQ();nut()}});
document.addEventListener("change",ev=>{if(ev.target.id==="lblfile"){const fl=ev.target.files&&ev.target.files[0];ev.target.value="";if(fl)labelPhoto(fl);return}if(W&&ev.target.id==="wjob"){W.job=ev.target.value;renderWizard();return}if(R&&ev.target.id==="rspread"){R.spread=ev.target.checked;renderRecipe();return}if(R&&ev.target.id==="rkeep"){R.keep=ev.target.checked;return}if(ev.target.name==="fixon"&&ev.target.form&&ev.target.form.id==="pf")saveProfil(ev.target.form)});
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target;
 if(f.id==="pf")saveProfil(f);else if(f.id==="mf")saveManual(f);else if(f.id==="sf")setup(f);
 else if(f.id==="ff")saveFoodForm(f)});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="ean")byBarcode(ev.target.value)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;
 if(cur<TODAY()&&!$("sheet").classList.contains("on")&&Date.now()-C.ts>6*36e5)cur=TODAY();
 if(Date.now()-C.ts>60000){refreshIfChanged().then(()=>{if(view==="dash")showDash()})}else flush()});
addEventListener("online",flush);
addEventListener("resize",()=>{const f=$("dashf"),t=document.querySelector(".top");if(f&&t){f.style.top=t.getBoundingClientRect().bottom+"px";f.style.height=`calc(100% - ${t.getBoundingClientRect().bottom}px)`}});

/* Kein Zoomen wie auf einer Webseite: Pinch (iOS-Gesten, Zwei-Finger-Bewegung) und Doppeltipp sperren – auch im Dashboard-Rahmen */
function noZoom(doc){const stop=e=>e.preventDefault();["gesturestart","gesturechange","gestureend"].forEach(t=>doc.addEventListener(t,stop,{passive:false}));
 doc.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})}
noZoom(document);
/* Tipp-Zeile im Tagebuch nur bei den ersten 5 Starts */
const TIPS=LS.get("tipps",0);LS.set("tipps",TIPS+1);
/* Neue App-Version automatisch laden: der Workflow „App veröffentlichen“ stempelt APPV und version.txt.
   Geprüft beim Start und bei jeder Rückkehr in die App; nie während ein Eingabefenster offen ist. */
const APPV="8ce57a8";
async function checkUpdate(){if(APPV.startsWith("__"))return;
 try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(!v||v===APPV||$("sheet").classList.contains("on"))return;
  if(LS.get("upd","")===v&&Date.now()-LS.get("updts",0)<6e5)return;  /* Schutz vor Endlosschleife, falls der CDN noch alt ausliefert */
  LS.set("upd",v);LS.set("updts",Date.now());location.replace("./?v="+v)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
checkUpdate();
/* Start: sofort mit dem letzten Stand anzeigen, dann im Hintergrund frisch laden */
if(CFG.token){render();loadAll()}else showSetup();
</script></body></html>
