<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KingStats</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KingStats"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0c1418" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#122028;--mute:#5b6c75;--line:#dbe3e7;--grid:#e6ecef;--acc:#0b6e8e;--acc-bg:#dcecf2;
 --g:#1f8a5b;--y:#c98712;--r:#c2453f;--p:#7c5cc4;--c:#d08a1e;--f:#2f86c6;--rad:18px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0c1418;--card:#151f24;--ink:#e3ebee;--mute:#8fa1a8;--line:#26343b;--grid:#1f2c33;--acc:#4fb6d6;--acc-bg:#16343f;
 --g:#4cb07f;--y:#e2a640;--r:#e0726c;--p:#a58ae6;--c:#e6a54a;--f:#5aa9e0;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 display:flex;align-items:center;gap:6px;padding:8px 10px}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:transparent;font-size:22px;min-width:44px;height:44px;border-radius:12px;color:var(--acc);display:inline-flex;align-items:center;justify-content:center}.ib:disabled{opacity:.25}
.streak{border:0;background:color-mix(in srgb,#f08a24 16%,transparent);color:#c4620a;font-weight:700;border-radius:99px;padding:5px 10px;font-size:15px;min-width:44px;min-height:44px}
@media(prefers-color-scheme:dark){.streak{color:#f3a14f}}
.streak.off{background:var(--grid);color:var(--mute)}
.stat{font-size:12px;color:var(--mute);text-align:center;margin:-2px 0 8px;min-height:16px}.stat.w{color:var(--y)}
main{padding:0 14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.card h2 small{font-weight:400;color:var(--mute);font-size:13px}
.mute{color:var(--mute)}.s{font-size:13px}.warn{color:var(--y)}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px}
.dnav b{font-size:15px}
.today{display:block;margin:-4px auto 10px;border:0;background:var(--acc);color:#fff;font-weight:600;font-size:14px;border-radius:99px;padding:7px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
/* Tagesübersicht */
.hero{display:flex;align-items:center;gap:14px}.hero svg{width:132px;flex:none}
.hero .kv{flex:1;display:grid;gap:6px;font-size:14px}.hero .kv div{display:flex;justify-content:space-between}.hero .kv b{font-weight:600}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mac div{font-size:13px}.mac b{display:block;font-size:15px}.mac small{color:var(--mute)}
.bar{height:7px;border-radius:5px;background:var(--grid);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:5px}
details.more{margin-top:10px;font-size:14px}details.more summary{color:var(--acc);cursor:pointer;list-style:none}details.more summary::-webkit-details-marker{display:none}
.mrow{margin:8px 0}.mrow .t{display:flex;justify-content:space-between;font-size:14px}.mrow .t span:last-child{color:var(--mute)}.mrow .t b{color:var(--ink);font-weight:600}
.hint{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,#f08a24 12%,var(--card));border:1px solid color-mix(in srgb,#f08a24 30%,var(--line));border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.meal{padding:12px 14px 6px}.meal h2{margin-bottom:4px}
.meal h2 .mbtns{display:flex;gap:6px}.meal h2 .add.sp{font-size:18px;background:color-mix(in srgb,#f08a24 14%,transparent)}
.meal h2 .add svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.meal{padding-bottom:0}
.mlist{padding:4px 14px}.mrw{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}.mrw+.mrw{border-top:1px solid var(--grid)}
.mic{position:relative;width:56px;height:56px;flex:none}.mic svg{width:56px;height:56px;display:block}.mic i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column}.mtx b{font-size:17px}.mtx .arr{color:var(--mute);font-weight:400}.mtx small{color:var(--mute);font-size:14px}
.mpl,.mpb{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.mpb{background:var(--acc-bg);font-size:19px}
.hint .lnk{margin-left:auto;border:0;background:none;color:var(--mute);font-size:16px;padding:4px 6px}
.mdet{padding-bottom:90px}.mhero{background:color-mix(in srgb,var(--acc) 22%,var(--card));border-radius:var(--rad);height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.mhero i{font-style:normal;font-size:64px;line-height:1}.mhero small{color:var(--mute);font-size:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;background:var(--card);margin-bottom:12px}
.mgrid div{padding:12px;text-align:center;display:flex;flex-direction:column}.mgrid div:nth-child(odd){border-right:1px solid var(--line)}.mgrid div:nth-child(-n+2){border-bottom:1px solid var(--line)}
.mgrid b{font-size:20px}.mgrid span{font-size:13px;color:var(--mute)}
.mact{display:flex;gap:8px;margin-bottom:12px}.mact button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center}
.mact button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.mact small{font-size:11px;color:var(--mute);font-weight:400}
.mh{font-size:20px;margin:16px 2px 8px}.mgo{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);max-width:640px;margin:auto}
.mft{display:flex;border-top:1px solid var(--grid);margin:4px -14px 0}.mft button{flex:1;border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;padding:11px 6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.mft button+button{border-left:1px solid var(--grid)}.mft svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cpy{display:block;width:100%;text-align:left;border:1px dashed color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 6%,var(--card));color:var(--acc);border-radius:12px;padding:9px 12px;margin:2px 0 10px;font-size:14px;font-weight:600}
.cpy small{display:block;color:var(--mute);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal h2 .add{border:0;background:var(--acc-bg);color:var(--acc);border-radius:99px;width:44px;height:44px;font-size:24px;line-height:1;font-weight:500}
.empty{font-size:13px;color:var(--mute);padding:4px 0 8px}
/* Wischen zum Löschen */
.sw{position:relative;overflow:hidden;border-top:1px solid var(--grid)}
.sw .bg{position:absolute;inset:0;background:var(--r);display:flex;justify-content:flex-end;align-items:center}
.sw .bg button{border:0;background:none;color:#fff;font-weight:600;height:100%;width:92px}
.swc{position:relative;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;width:100%;border:0;text-align:left;transition:transform .2s;touch-action:pan-y}
.swc.drag{transition:none}
.swc span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}.swc small{color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--r)}.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c0) 16%,transparent);color:color-mix(in srgb,var(--c0) 80%,var(--ink))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs svg,.drawer svg,.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc);font-weight:600}
.tabs button{position:relative}.tabs .bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--r);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:17px;text-align:center}
.top .dtl{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:2px 0}
.top .dtl b{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.top .dtl small{font-size:12px;color:var(--mute)}
/* Seitenmenü */
.scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:16;width:min(82vw,320px);background:var(--card);transform:translateX(-102%);transition:transform .25s ease;
 padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px;box-shadow:0 0 40px rgba(0,0,0,.2);overflow-y:auto}
.drawer.on{transform:none}
.drawer .hd{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 10px 4px}
.drawer button.it{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:11px 10px;text-align:left;font-size:16px}
.drawer button.it:disabled{color:var(--mute);cursor:default}.drawer button.it.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.drawer .ttl{font-size:22px;font-weight:700;margin:0 10px 6px}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block}.sheet .top{background:var(--bg)}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:17px}
.inp:focus{outline:2px solid var(--acc);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.res span:first-child{min-width:0}.res b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}.res small{color:var(--mute);font-size:12px}.res em{font-style:normal;white-space:nowrap;color:var(--acc);font-size:22px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:16px 2px 6px}
.qs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.qs button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px}
.seg{display:flex;background:var(--grid);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font-size:14px}.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amt .units{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -4px 10px;padding-left:4px;scrollbar-width:none}.amt .units::-webkit-scrollbar{display:none}
.amt .units button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.amt .units button small{font-size:10px;font-weight:500;color:var(--mute)}.amt .units button.on{background:var(--acc);border-color:var(--acc);color:#fff}.amt .units button.on small{color:#e6f2f6}
.qrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 8px}
.qb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--grid);font-size:28px;line-height:1;color:var(--acc)}
.qv{text-align:center;min-width:120px}.qv input{width:120px;border:0;background:none;text-align:center;font-size:40px;font-weight:700;color:var(--ink);padding:0}
.qv input:focus{outline:none;border-bottom:2px solid var(--acc)}.qv span{display:block;font-size:14px;color:var(--mute);font-weight:600}
.qs button.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc);font-weight:600}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:12px 0}.nut div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px}.nut b{display:block;font-size:18px}.nut small{color:var(--mute);font-size:11px}
video{width:100%;border-radius:var(--rad);background:#000;aspect-ratio:3/4;object-fit:cover}
.scanwrap{position:relative;border-radius:var(--rad);overflow:hidden;background:#000;aspect-ratio:3/4}.scanwrap video{height:100%;border-radius:0;display:block}
.scanbox{position:absolute;left:14%;right:14%;top:50%;transform:translateY(-50%);aspect-ratio:1;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.5);transition:border-color .15s}
.scanbox i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--r);box-shadow:0 0 8px var(--r);animation:scl 1.6s ease-in-out infinite alternate}
.scanbox.hit{border-color:var(--g)}.scanbox.hit i{background:var(--g);box-shadow:0 0 8px var(--g);animation:none}
@keyframes scl{from{top:18%}to{top:82%}}
.lblhint{background:var(--acc-bg);border-radius:14px;padding:12px 14px;margin:4px 0 10px;display:grid;gap:4px;font-size:14px}.lblhint small{color:var(--mute)}.lblhint .lnk{border:0;background:none;padding:0;font:inherit;color:var(--acc);text-decoration:underline}
.lblbtn{display:block;text-align:center;margin:6px 0 2px;cursor:pointer}.lblst{margin:4px 0 0;min-height:0;color:var(--mute)}.lblst.ok{color:var(--g)}.lblst.warn{color:var(--y)}.lblst.bad{color:var(--r)}
.inp.auto{background:var(--acc-bg)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;
 opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast.on{opacity:1;transform:none}.toast button{border:0;background:none;color:var(--acc-bg);font-weight:700;pointer-events:auto;padding:4px 6px}
/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mute);text-align:center;padding-bottom:2px}
.cal button{position:relative;aspect-ratio:1;border:0;border-radius:11px;background:var(--grid);font-size:14px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.cal button small{font-size:9px;font-weight:500;opacity:.85}
.cal button.g{background:var(--g);color:#fff}.cal button.y{background:var(--y);color:#fff}.cal button.r{background:var(--r);color:#fff}
.cal button.o{background:var(--acc-bg);color:var(--acc)}.cal button.fut{opacity:.35}.cal button.fut.o{opacity:.8}.cal button.t{outline:2px solid var(--acc);outline-offset:1px}
.cal .x{visibility:hidden}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:12px}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.kp b{display:block;font-size:22px}.kp span{font-size:12px;color:var(--mute)}
.wk{display:flex;align-items:flex-end;gap:4px;height:140px;margin:6px 0 4px;position:relative}.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.wk i{display:block;width:70%;border-radius:4px 4px 0 0}.wk em{position:absolute;left:8%;right:8%;height:2px;background:var(--ink);opacity:.5}
.wkl{display:flex;gap:4px}.wkl span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.drow{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--grid);font-size:14px;cursor:pointer}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0}.tg input{width:22px;height:22px;accent-color:var(--acc)}
.cmp{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
.foot{font-size:12px;color:var(--mute);margin:16px 2px}
/* Mein Tag */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.tile span{font-size:12px;color:var(--mute);display:block}
.tile b{font-size:24px;font-weight:700;display:block;line-height:1.2}.tile b small{font-size:13px;font-weight:500;color:var(--mute)}.tile em{font-style:normal;font-size:12px}
.wkp{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}.wkp div{background:var(--grid);border-radius:10px;padding:6px 0}.wkp div.t{outline:2px solid var(--acc)}
.wkp b{display:block;font-size:18px;line-height:1.3}
.burn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--grid);text-align:center}
.burn b{display:block;font-size:20px;font-weight:700;line-height:1.2}.burn span{font-size:12px;color:var(--mute)}.burn .fire b{color:#d4661a}
@media(prefers-color-scheme:dark){.burn .fire b{color:#f3a14f}}
.wt{display:flex;justify-content:space-between;align-items:center;gap:10px}.wt b{font-size:22px}.wt div{text-align:center;flex:1}.wt span{display:block;font-size:12px;color:var(--mute)}
.alist{display:flex;flex-wrap:wrap;gap:8px}.alist div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.alist div b{color:var(--ink);font-weight:600}.alist i{font-style:normal;font-size:18px}

/* Tagebuch: Klassen statt Inline-Stilen, „+“-Knopf im Daumenbereich */

const IC={menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',

 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',

 cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2.2l2.4 11h10.9l2-8H6.4"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 sync:'<path d="M20 12a8 8 0 0 1-14 5M4 12a8 8 0 0 1 14-5"/><path d="M18 3v4h-4M6 21v-4h4"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;

/* ===== GitHub ===== */
const b64e=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opt={},accept="application/vnd.github+json"){
 const r=await fetch("https://api.github.com/repos/"+CFG.repo+path,{cache:"no-store",...opt,
  headers:{Authorization:"Bearer "+CFG.token,Accept:accept,"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
 if(r.status===401){const e=new Error("Token ungültig oder abgelaufen");e.auth=1;throw e}
 return r}
async function getJson(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`);
 if(r.status===404)return{data:null,sha:null};if(!r.ok)throw new Error("GitHub "+r.status);
 const j=await r.json();return{data:j.content?JSON.parse(b64d(j.content)):null,sha:j.sha}}
async function getRaw(file){const r=await gh(`/contents/${file}?ref=${CFG.branch}`,{},"application/vnd.github.raw+json");
 if(r.status===404)return null;if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
async function put(file,data,sha,msg){const r=await gh(`/contents/${file}`,{method:"PUT",body:JSON.stringify({message:msg,branch:CFG.branch,
  content:b64e(JSON.stringify(data,null,1)+"\n"),...(sha?{sha}:{})})});
 if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error("Speichern fehlgeschlagen ("+r.status+")");return true}

/* ===== Änderungen: lokal sofort, dann Warteschlange und hochladen ===== */
const P_PROF="data/ernaehrung/profil.json",P_LM="data/ernaehrung/lebensmittel.json",P_SHOP="data/ernaehrung/einkauf.json",pMonth=d=>`data/ernaehrung/${d.slice(0,7)}.json`;
function apply(obj,op){
 if(op.t==="profil")return op.v;
 if(op.t==="food"||op.t==="fooddel"){const o=obj||{items:[]},it=(o.items||[]).filter(x=>x.id!==(op.t==="food"?op.item.id:op.id));
  if(op.t==="food")it.push(op.item);return{...o,items:it}}
 const o=obj||{},L=(o[op.d]||[]).filter(x=>x.id!==(op.e?op.e.id:op.id));
 if(op.t==="add"||op.t==="upd")L.push(op.e);
 o[op.d]=L;if(!L.length)delete o[op.d];return o}

 if(path===P_PROF)C.profil=apply(C.profil,op);
 else if(path===P_LM)C.lm=apply(C.lm,op);
 else if(path===P_SHOP)C.shop=apply(C.shop,op);
 else{const m=path.slice(-12,-5);C.months[m]=apply(C.months[m]||{},op)}}
function setFile(path,v){if(path===P_PROF)C.profil=v;else if(path===P_LM)C.lm=v||{items:[]};else if(path===P_SHOP)C.shop=v||{items:[]};else C.months[path.slice(-12,-5)]=v||{};
 for(const x of Q)if(x.path===path)local(path,x.op)}
function change(path,op,noRender){
 /* Schutz: nie unter ungültigem Datum speichern (sonst landet der Eintrag in data/ernaehrung/.json und ist unsichtbar) */
 if("d" in op&&!/^\d{4}-\d\d-\d\d$/.test(op.d||"")){console.warn("Ungültiges Datum beim Speichern",op.d);const d=/^\d{4}-\d\d-\d\d$/.test(cur)?cur:TODAY();op={...op,d};path=pMonth(d)}
 local(path,op);Q.push({path,op});saveC();saveQ();if(!noRender)render();flush()}
async function flush(){
 if(busy||!Q.length||!CFG.token)return;busy=true;setStatus();
 try{for(const path of [...new Set(Q.map(x=>x.path))]){const ops=Q.filter(x=>x.path===path);let ok=false;
   for(let i=0;i<4&&!ok;i++){const{data,sha}=await getJson(path);let v=data;for(const x of ops)v=apply(v,x.op);
    const n=ops.length,msg=path===P_PROF?"Ernährung: Profil (iPhone)":path===P_LM?"Ernährung: Lebensmittel (iPhone)":path===P_SHOP?"Ernährung: Einkaufsliste (iPhone)":`Ernährung: ${n} Änderung${n>1?"en":""} (iPhone)`;

   if(!ok)throw new Error("Konflikt beim Speichern")}
  saveC();if(status==="offline")status=""}
 catch(e){if(e.auth){busy=false;return showSetup(e.message)}status="offline"}
 busy=false;setStatus();if(Q.length&&status!=="offline")flush()}

/* ===== Laden ===== */
const trimStore=(st,days)=>{const lim=EK.add(TODAY(),-days),d={},a=[];
 for(const k in st.days)if(k>=lim)d[k]=st.days[k];
 for(const k in st.acts){const x=st.acts[k];if(x.date>=lim)a.push({date:x.date,name:x.name,type:x.type,kcal:x.kcal,bmr:x.bmr,km:x.km,min:x.min,hr:x.hr,t0:x.t0})}

const trimPlan=p=>{if(!p||!p.days)return null;const lo=EK.add(TODAY(),-10),hi=EK.add(TODAY(),21),d={};for(const k in p.days)if(k>=lo&&k<=hi)d[k]=p.days[k];return{meta:p.meta,days:d}};
/* Neuester Commit auf dem Branch (1 kleine Anfrage) */

 if(!CFG.token)return showSetup();
 status="lädt";setStatus();
 try{const hd=await headSha().catch(e=>{if(e.auth)throw e;return null});

/* ===== Berechnungen ===== */
const GW=()=>{const d=C.store&&C.store.days;if(!d)return null;const k=Object.keys(d).sort().reverse().find(x=>d[x].weight);return k?d[k].weight:null};
const prof=()=>{const w=GW();return EK.prof({...(w?{weight:Math.round(w*10)/10}:{}),...(C.profil||{})})};
const G=()=>C.store?{days:C.store.days,acts:C.store.acts,today:TODAY(),plan:C.plan&&C.plan.days||null}:null;
const entries=d=>(C.months[d.slice(0,7)]||{})[d]||[];
/* Ausgleich (siehe Rechenkern): Überschüsse werden auf Folgetage verteilt und senken dort das Ziel. Einmal je Darstellung berechnet. */

function calcAus(){const p=prof(),g=G(),L=[];
 for(let k=-45;k<=14;k++){const d=EK.add(TODAY(),k),e=entries(d);L.push({d,has:e.length>0,eaten:EK.sum(e).kcal,target:EK.target(p,g,d).kcal,w:EK.weight(planDay(d))})}

 const aus=Math.round(AUSR.share[d]||0),t={...t0,kcal:t0.kcal-aus,aus,orig:t0.kcal,carry:AUSR.carry[d]||null},m=EK.macros(p,t.kcal),ch=AUSR.cheats[d]||null;
 let kg=e.length&&done?EK.ampel("kcal",s.kcal,t.kcal):null,grade=e.length&&done?EK.dayGrade(s,t,m):null;
 if(ch&&ch.state==="full"){kg="g";if(grade!=="g")grade=EK.ampel("p",s.p,m.p)==="r"?"y":"g"}

/* Kategorie: Getränke/Tiefkühl zuerst, sonst das längste passende Stichwort (z. B. „Erdnussbutter“ → Vorrat, nicht Kühlregal) */
function shopCat(name){const t=" "+EK.norm(name)+" ",w=t.split(/\s+/);

/* Tags für deine Gerichte/Lebensmittel: Stichworte im Namen + Nährwerte der Portion */
function moodTags(name,n){const t=" "+EK.norm(name)+" ",k=+n.kcal||1,T=new Set();
 const su=KW_SUESS.some(x=>t.includes(x))||(n.sug!=null&&n.sug>=8&&4*n.sug/k>=.25);T.add(su?"suess":"herzhaft");
 if(KW_WARM.some(x=>t.includes(x)))T.add("warm");if(k<=300)T.add("snack");if((n.p||0)>=15&&4*n.p/k>=.25)T.add("protein");return[...T]}
/* „Mag ich nicht“: im Profil (profil.json) unter magNicht [Wörter] und ideeAus [Ideen-IDs].
   Ein Vorschlag fällt raus, wenn ein Wort im Namen oder in einer Zutat vorkommt (Groß-/Kleinschreibung und Umlaute egal) oder die Idee ausgeblendet ist. */
const dislikes=()=>((C.profil&&C.profil.magNicht)||[]),hiddenIdeas=()=>((C.profil&&C.profil.ideeAus)||[]);
/* Wortstamm, damit „Gurken“ auch „Gurke“ trifft und „Linsen“ auch „Linse“ (Mehrzahl-Endungen weg, nie kürzer als 3 Buchstaben) */
const stem=w=>{w=EK.norm(w).trim().replace(/\s+/g," ");for(const e of["en","n","e","s"])if(w.endsWith(e)&&w.length-e.length>=(e==="s"?4:3))return w.slice(0,-e.length);return w};
/* Synonyme: ein Wort aus „Mag ich nicht“ schließt auch diese Begriffe aus */
const DISL_SYN={pilz:["champignon","steinpilz","pfifferling","shiitake","kraeuterseitling"],gurk:["gewuerzgurke","essiggurke","cornichon"],
 brokkoli:["broccoli"],paprika:["spitzpaprika"],zwiebel:["schalotte","fruehlingszwiebel"],lachs:["raeucherlachs"],thunfisch:["tuna"]};
/* Ausnahmen: „Erbsen“ soll keine Kichererbsen ausschließen */
const DISL_EXC={erbs:["kichererbs"]};
/* Umlaut-Mehrzahl: „Äpfel“ → auch „Apfel“, „Nüsse“ → „Nuss“ */
const deUml=w=>w.replace(/(ae|oe|ue)/,m=>m[0]);
function disliked(c){if(c.k==="idee"&&hiddenIdeas().includes(c.id))return true;const W=dislikes().map(stem).filter(Boolean);if(!W.length)return false;
 const W2=[...new Set(W.flatMap(w=>[w,deUml(w),...(DISL_SYN[w]||[])]))].filter(w=>w.trim().length>=3);
 const T=[c.name,...(c.zutaten||[]).map(z=>z.name)].map(x=>" "+EK.norm(x)+" ");
 return T.some(t=>W2.some(w=>{let u=t;for(const x of(DISL_EXC[w]||[]))u=u.split(x).join(" ");return u.includes(w)}))}

function ideas(i){const left=i.t.kcal-i.s.kcal,pl=Math.max(0,i.m.p-i.s.p),light=left<120,cap=light?150:left*1.05+20,L=[];
 for(const f of dishes()){const n=perPortion(f);if(n.kcal==null)continue;L.push({k:"dish",id:f.id,name:f.name,n,g:(f.portion&&f.portion.g)||100,tags:moodTags(f.name,n),zutaten:f.zutaten&&f.zutaten.length?f.zutaten:null,f})}

  L.push({k:"fav",id:f.id,name:f.name+(f.marke?" ("+f.marke+")":""),n,g,tags:moodTags(f.name,n),f})}

async function _buildDash(){
 try{const tr=await gh(`/git/trees/${CFG.branch}?recursive=1`);if(!tr.ok)throw new Error("tree");
  const tree=(await tr.json()).tree.filter(x=>x.type==="blob"&&/^src\/(index\.html|favicon\.png|css\/.+\.css|js\/.+\.js|fonts\/.+\.woff2)$/.test(x.path));
  const get=async x=>{const k="blob:"+x.sha;let v=await KV.get(k);if(v==null){const r=await gh(`/git/blobs/${x.sha}`);if(!r.ok)throw new Error("blob");v=(await r.json()).content.replace(/\s/g,"");KV.set(k,v)}return v};
  const files={};await Promise.all(tree.map(async x=>files[x.path]=await get(x)));
  const txt=p=>b64d(files[p]),sorted=pre=>Object.keys(files).filter(p=>p.startsWith(pre)).sort();
  let st=JSON.parse(await KV.get("store_full")||"null"),pl=JSON.parse(await KV.get("plan_full")||"null");
  if(!st){st=await getRaw("data/store.json");KV.set("store_full",JSON.stringify(st))}
  if(!pl){pl=await getRaw("data/plan.json");if(pl)KV.set("plan_full",JSON.stringify(pl))}
  const tage={};for(const m of Object.keys(C.months).sort())Object.assign(tage,C.months[m]);
  const data={days:st.days,acts:Object.entries(st.acts).map(([k,v])=>({id:k,...v})),synced:st.synced,fitness:st.fitness??null,hrz:st.hrz??null,det:st.det??null,
   plan:pl,anp:C.anp,food:{profil:C.profil,tage}};
  let css=sorted("src/css/").map(p=>`/* ===== ${p.split("/").pop()} ===== */\n${txt(p)}`).join("\n");
  css=css.replace(/url\("(fonts\/[^"]+\.woff2)"\)/g,(m,f)=>files["src/"+f]?`url("data:font/woff2;base64,${files["src/"+f]}")`:m);
  const js=sorted("src/js/").map(p=>`/* ===== ${p.split("/").pop()} ===== */\n${txt(p)}`).join("\n").replace("__DATA__",()=>JSON.stringify(data).replace(/<\//g,"<\\/"));
  let html=txt("src/index.html").replace("__ICON__",files["src/favicon.png"]?"data:image/png;base64,"+files["src/favicon.png"]:"");
  html=html.replace("/*__CSS__*/",()=>css).replace("/*__JS__*/",()=>js);
  DASH.html=html;KV.set("dash_html",html);return html}
 catch(e){console.error(e);return null}}

const per100=e=>{const o={};for(const k of Object.keys(e.n||{}))o[k]=e.n[k]!=null&&e.g?e.n[k]*100/e.g:null;return o};
function fromEntry(e){const f=foods().find(x=>x.src===e.src&&(x.name===e.name||e.name.startsWith(x.name+" (")));if(f)return f;
 /* Grundnahrungsmittel: aus der Datenbank neu aufbauen, damit Einheiten (z. B. Scheibe) gleich bleiben */
 if(BLS&&String(e.src).startsWith("bls:")){const r=BLS.find(x=>"bls:"+x[0]===e.src);if(r)return fromBls(r)}
 if(e.unit&&e.g)return{id:e.src,name:e.name,src:e.src,n:per100(e)};

const UF={"µg>mg":1e-3,"mg>µg":1e3,"mg>g":1e-3,"g>mg":1e3};
function fromBls(r){const o={};BLSM.felder.forEach((k,i)=>{if(k==="water")return;let v=r[2+i];const mu=(EK.MICRO.find(m=>m[0]===k)||[])[2],bu=BLSM.einheiten[k];
  if(v!=null&&mu&&bu&&mu!==bu&&UF[bu+">"+mu])v=v*UF[bu+">"+mu];o[k]=v});return{id:"bls:"+r[0],name:r[1],src:"bls:"+r[0],n:o}}
function blsSearch(q){if(!BLS)return[];const w=EK.norm(q).split(/\s+/).filter(Boolean);if(!w.length)return[];
 /* BLS schreibt oft getrennt („Hafer Flocken“) – darum auch ohne Leerzeichen vergleichen */

/* Automatisch beim Öffnen: Garmin-Stand älter als 2 h → Cloud-Sync anstoßen (geplante GitHub-Läufe kommen oft Stunden zu spät).
   Höchstens 1× pro Stunde, nie während ein Sync läuft. */
function autoSync(){const sy=C.store&&C.store.synced;if(!sy||!CFG.token||Date.now()/1000-sy<2*3600||syncSince())return;
 if(Date.now()-LS.get("autosync",0)<36e5)return;LS.set("autosync",Date.now());syncGarmin(true)}
/* Sperre gegen Doppeltipp: Zeitpunkt des Starts in localStorage (max. 5 Min.), vor dem Start Prüfung auf einen schon laufenden Lauf */
const SYNC_LOCK=5*60e3,syncSince=()=>{const t=LS.get("sync",0);return t&&Date.now()-t<SYNC_LOCK?t:0},hhmm=t=>new Date(t).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
async function syncGarmin(auto){closeDrawer();
 const since=syncSince();if(since)return auto?null:toast(`Sync läuft bereits (seit ${hhmm(since)}) – neue Werte in Kürze`,3500);
 LS.set("sync",Date.now());
 const unlock=()=>LS.set("sync",0);
 try{let active=false;
  try{const r=await gh("/actions/workflows/garmin-sync.yml/runs?per_page=5");if(r.ok){const j=await r.json();active=(j.workflow_runs||[]).some(x=>x.status==="queued"||x.status==="in_progress"||x.status==="waiting")}}catch(e){if(e.auth)throw e}
  if(active){if(!auto)toast("Sync läuft bereits – neue Werte in Kürze",3500)}
  else{const r=await gh("/actions/workflows/garmin-sync.yml/dispatches",{method:"POST",body:JSON.stringify({ref:CFG.branch})});
   if(r.status===403){unlock();return toast("Token darf keine Actions starten – Berechtigung „Actions: Read and write“ ergänzen",4500)}
   if(!r.ok){unlock();return toast("Sync konnte nicht gestartet werden ("+r.status+")")}
   /* automatisch: kein Hinweis über dem Inhalt – die Statuszeile zeigt „wird aktualisiert“ */
   if(!auto)toast("Garmin-Sync gestartet – neue Werte in 1–2 Minuten",3500)}
  setStatus();
  const before=C.store&&C.store.synced;let n=0;
  const poll=async()=>{if(++n>8){unlock();return setStatus()}try{const st=await getRaw("data/store.json");if(st&&st.synced!==before){unlock();await loadAll();if(view==="dash")showDash();return auto?null:toast("Garmin-Daten aktualisiert")}}catch(e){}setTimeout(poll,30000)};
  setTimeout(poll,60000)}
 catch(e){unlock();toast(e.auth?e.message:"Keine Verbindung")}}

/* ===== Einrichtung ===== */
function showSetup(err){
 $("app").innerHTML=`<div class="top"><span style="min-width:42px"></span><h1>Einrichten</h1><span style="min-width:42px"></span></div><main>
 <div class="card"><p style="margin-top:0">Die App speichert dein Ernährungstagebuch in deinem GitHub-Repo – dort holt es sich auch das Dashboard. Dafür braucht sie einmalig einen GitHub-Token.</p>
 ${err?`<p style="color:var(--r)">${h(err)}</p>`:""}
 <form id="sf"><label class="f">Repository</label><input class="inp" name="repo" value="${h(CFG.repo)}" autocapitalize="off" autocorrect="off">
 <label class="f">GitHub-Token (fine-grained, beginnt mit github_pat_)</label><input class="inp" name="token" type="password" value="" placeholder="github_pat_…" autocapitalize="off" autocorrect="off">
 <button class="btn p w" style="margin-top:14px" type="submit">Verbinden</button></form>
 <p class="s mute">Der Token bleibt nur auf diesem iPhone gespeichert. Rechte, nur für dieses eine Repository: Contents „Read and write“, Actions „Read and write“.</p></div></main>`}
async function setup(f){const repo=f.elements.repo.value.trim(),token=f.elements.token.value.trim();if(!repo||!token)return toast("Repo und Token angeben");
 CFG={...CFG,repo,token};
 try{const r=await gh("");if(r.status===404){CFG.token="";return showSetup("Repo nicht gefunden – Name prüfen oder dem Token Zugriff auf dieses Repo geben.")}
  const j=await r.json();if(j.permissions&&!j.permissions.push){CFG.token="";return showSetup("Der Token darf nicht schreiben – Contents „Read and write“ setzen.")}
  CFG.branch=j.default_branch||"main";LS.set("cfg",CFG);toast("Verbunden");render();loadAll()}
 catch(e){CFG.token="";showSetup(e.message||"Keine Verbindung")}}

 else if(b("[data-rinfo]"))toast(RINFO,9000);

 else if(x=b("[data-dislrm]")){const W=dislikes().slice(),w=W.splice(+x.dataset.dislrm,1)[0];setProf({magNicht:W});toast(`„${w}“ wird wieder vorgeschlagen`)}
 else if(x=b("[data-ideeon]"))setProf({ideeAus:hiddenIdeas().filter(i=>i!==x.dataset.ideeon)});
 else if(b("[data-ideeoff]")){const id=IDX.c.id,nm=IDX.c.name;closeSheet();setProf({ideeAus:[...hiddenIdeas().filter(i=>i!==id),id]});toast(`„${nm}“ ausgeblendet`,4500,"Rückgängig",()=>setProf({ideeAus:hiddenIdeas().filter(i=>i!==id)}))}
 else if(b("[data-micro]"))openMicro(cur);
 else if(b("[data-wizard]"))openWizard();
 else if(x=b("[data-wrate]")){W.ziel=($("wziel")||{}).value??W.ziel;W.rate=+x.dataset.wrate;renderWizard()}
 else if(b("[data-wapply]")){W.ziel=($("wziel")||{}).value??W.ziel;applyWizard()}
 else if(b("[data-raddz]")){S={...S,mode:"recipe",q:"",off:null,offq:""};sheetAdd();setTimeout(()=>{const i=$("q");i&&i.focus()},80)}
 else if(x=b("[data-rdel]")){R.items.splice(+x.dataset.rdel,1);renderRecipe()}
 else if(x=b("[data-rn]")){R.portions=Math.max(1,Math.min(14,R.portions+(+x.dataset.rn)));renderRecipe()}
 else if(x=b("[data-rmeal]")){R.meal=x.dataset.rmeal;renderRecipe()}
 else if(b("[data-rsave]"))saveRecipe();
 else if(x=b("[data-back]")){stopScan();if(x.dataset.back==="close")closeSheet();else sheetAdd()}
 else if(x=b("[data-pick]"))openAmount({food:PICK[+x.dataset.pick]});

 else if(x=b("[data-qset]"))setQ(+x.dataset.qset);
 else if(x=b("[data-meal]")){A.meal=x.dataset.meal;document.querySelectorAll("[data-meal]").forEach(y=>y.classList.toggle("on",y===x))}
 else if(b("[data-save]"))saveAmount();
 else if(b("[data-fav]"))toggleFav();
 else if(b("[data-sync]"))syncGarmin();
 else if(b("[data-dashre]")){toast("Dashboard wird neu geladen …");DASH.shown=null;buildDash().then(h=>{if(h&&view==="dash"){const f=$("dashf");if(f){setFrame(f,h);DASH.shown=h}}})}
 else if(b("[data-reload]"))loadAll();
 else if(b("[data-blsload]"))loadBls(true);
 else if(b("[data-logout]")){if(confirm("Token von diesem iPhone entfernen?")){CFG.token="";LS.set("cfg",CFG);showSetup()}}});

 else if(f.id==="dislf")dislikeAdd()});

 if(cur<TODAY()&&!$("sheet").classList.contains("on")&&Date.now()-C.ts>6*36e5)cur=TODAY();
 if(Date.now()-C.ts>60000){refreshIfChanged().then(()=>{if(view==="dash")showDash()})}else flush()});
addEventListener("online",flush);
addEventListener("resize",()=>placeDash($("dashf")));

/* Kein Zoomen wie auf einer Webseite: Pinch (iOS-Gesten, Zwei-Finger-Bewegung) und Doppeltipp sperren – auch im Dashboard-Rahmen */
function noZoom(doc){const stop=e=>e.preventDefault();["gesturestart","gesturechange","gestureend"].forEach(t=>doc.addEventListener(t,stop,{passive:false}));
 doc.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})}
noZoom(document);
/* Tipp-Zeile im Tagebuch nur bei den ersten 5 Starts */
const TIPS=LS.get("tipps",0);LS.set("tipps",TIPS+1);
/* Neue App-Version automatisch laden: der Workflow „App veröffentlichen“ stempelt APPV und version.txt.
   Geprüft beim Start und bei jeder Rückkehr in die App; nie während ein Eingabefenster offen ist. */
const APPV="6f9a3af";
async function checkUpdate(){if(APPV.startsWith("__"))return;
 try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const v=(await r.text()).trim();
  if(!v||v===APPV||$("sheet").classList.contains("on"))return;
  if(LS.get("upd","")===v&&Date.now()-LS.get("updts",0)<6e5)return;  /* Schutz vor Endlosschleife, falls der CDN noch alt ausliefert */
  LS.set("upd",v);LS.set("updts",Date.now());location.replace("./?v="+v)}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
checkUpdate();
/* Start: sofort mit dem letzten Stand anzeigen, dann im Hintergrund frisch laden */
if(CFG.token){render();loadAll()}else showSetup();
</script></body></html>
